function checkScrollBtn(){if(chat.scrollTop<chat.scrollHeight-chat.clientHeight-60)scrollBtn.classList.add('show');else scrollBtn.classList.remove('show');}
chat.addEventListener('scroll',checkScrollBtn);
function typeText(el,text,speed,onDone){el.textContent="";var i=0;(function next(){if(i<text.length){el.textContent+=text[i++];chat.scrollTop=chat.scrollHeight;setTimeout(next,speed);}else{requestAnimationFrame(function(){chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});checkScrollBtn();if(onDone)onDone();});}})();}
function say(role,text,isUser){var d=document.createElement('div');d.className='msg'+(isUser?' user':'');if(isUser)d.innerHTML='<img class="av" src="https://placehold.co/100x100/333/fff?text=Me"><div><div class="name">You</div><div class="bubble"></div></div>';else d.innerHTML='<img class="av" src="'+avs[role]+'"><div><div class="name '+nameClass[role]+'">'+role.charAt(0).toUpperCase()+role.slice(1)+'</div><div class="bubble '+bubbleClass[role]+'"></div></div>';chat.appendChild(d);chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});if(!isUser)typeText(d.querySelector('.bubble'),text,28);else d.querySelector('.bubble').textContent=text;}
async function callAI(role,msg){if(!API_KEY)return"（未设置 API Key）";var last="";for(var i=0;i<API_ENDPOINTS.length;i++){try{var ctl=new AbortController();var to=setTimeout(function(){ctl.abort();},25000);var res=await fetch(API_ENDPOINTS[i],{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},body:JSON.stringify({model:MODEL,messages:[{role:"system",content:prompts[role]},{role:"user",content:msg}],max_tokens:300,temperature:.9}),signal:ctl.signal});clearTimeout(to);var data=await res.json();if(data.error){last=data.error.message||JSON.stringify(data.error);if(/token|key|auth/i.test(last))return"（API 错误："+last+"）";continue;}return data.choices?data.choices[0].message.content:"（魔界通讯中断…）";}catch(e){last=e.name==='AbortError'?"请求超时":e.message;continue;}}return"（所有接口都失败了："+last+"）";}
async function send(){var ui=document.getElementById('ui');var t=ui.value.trim();if(!t)return;say('you',t,true);ui.value='';blood();var temp=document.createElement('div');temp.className='msg';temp.innerHTML='<img class="av" src="'+avs[cur]+'"><div><div class="name '+nameClass[cur]+'">'+cur+'</div><div class="bubble '+bubbleClass[cur]+'" style="color:#888;font-style:normal">思考中...</div></div>';chat.appendChild(temp);chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});var reply=await callAI(cur,t);temp.querySelector('.bubble').textContent="";temp.querySelector('.bubble').style.color="";temp.querySelector('.bubble').style.fontStyle="";typeText(temp.querySelector('.bubble'),reply,28,function(){stylePop(t.length,reply);});}
function sw(c){if(cur===c)return;cur=c;document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('active');});document.getElementById('b-'+c).classList.add('active');chat.innerHTML='';say(c,intros[c],false);scrollBtn.classList.remove('show');updateTitleColor(c);flashPage(c);if(audioUnlocked)playRole(c);}

/* === 火焰拖尾特效（尼禄武器点击）=== */
document.getElementById('weapon-img').addEventListener('click',function(){if(cur==='nero'&&!weaponAnimating)fireEgg();});
function fireEgg(){
weaponAnimating=true;
var fly=document.getElementById('weapon-fly');
var staticImg=document.getElementById('weapon-img');
var rect=staticImg.getBoundingClientRect();
var sx=rect.left+rect.width/2,sy=rect.top+rect.height/2;
fly.src=WEAPON_IMGS.nero;
fly.style.display='block';
fly.style.left=sx+'px';fly.style.top=sy+'px';
fly.style.width=rect.width+'px';
fly.style.marginLeft=(-rect.width/2)+'px';fly.style.marginTop=(-rect.height/2)+'px';
fly.style.opacity='1';fly.style.transition='none';fly.style.transform='rotate(0deg)';
staticImg.style.opacity='0';
fly.offsetWidth;
var dur=900;
fly.style.transition='left '+dur+'ms cubic-bezier(.4,0,.2,1), opacity 300ms ease '+(dur-300)+'ms, transform '+dur+'ms ease';
fly.style.left=(innerWidth+120)+'px';fly.style.transform='rotate(15deg)';fly.style.opacity='0';
var layer=document.getElementById('fire-layer');layer.innerHTML='';
for(var i=0;i<24;i++){(function(i){
var p=document.createElement('div');p.className='fire-particle';
var delay=Math.random()*180,life=400+Math.random()*400;
var size=8+Math.random()*10;
p.style.width=size+'px';p.style.height=size+'px';
p.style.left=sx+'px';p.style.top=(sy+(Math.random()-.5)*36)+'px';
p.style.background=i%2==0?'radial-gradient(circle,#fff 0%,#ffd700 30%,#ff6a00 60%,transparent 100%)':'radial-gradient(circle,#fff 0%,#4fc3f7 40%,transparent 100%)';
p.style.boxShadow=i%2==0?'0 0 8px #ff6a00,0 0 16px #ff2d00':'0 0 8px #4fc3f7,0 0 16px #4fc3f7';
layer.appendChild(p);p.offsetWidth;
p.style.transition='left '+life+'ms linear '+delay+'ms, top '+life+'ms ease-in '+delay+'ms, opacity 300ms ease '+(delay+life-300)+'ms, width 500ms ease, height 500ms ease';
p.style.left=(sx+(innerWidth-sx)*.75+Math.random()*80)+'px';
p.style.top=(sy+(Math.random()-.5)*30)+'px';
p.style.opacity='0';p.style.width=(size*.3)+'px';p.style.height=(size*.3)+'px';
setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},delay+life+100);
})(i);}
setTimeout(function(){fly.style.display='none';fly.style.left='0px';fly.style.opacity='0';staticImg.style.opacity='';weaponAnimating=false;},dur+100);
}

/* 魔人化 */
var pressTimer=null,pressStart=0;
function bindDT(id,role){var b=document.getElementById(id);b.addEventListener('touchstart',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(role);},1500);});b.addEventListener('touchend',function(e){e.preventDefault();clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(role);});b.addEventListener('mousedown',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(role);},1500);});b.addEventListener('mouseup',function(){clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(cur);});b.addEventListener('mouseleave',function(){clearTimeout(pressTimer);});}
function triggerDT(role){var o=role==='dante'?document.getElementById('dt-red'):document.getElementById('dt-blue');o.classList.add('show');setTimeout(function(){o.classList.remove('show');},800);say(role,dtLines[role],false);}
bindDT('b-nero','nero');bindDT('b-dante','dante');bindDT('b-vergil','vergil');
function bloodFlash(){var f=document.createElement('div');f.className='blood-flash show';document.body.appendChild(f);setTimeout(function(){f.remove();},400);}
function blood(){bloodFlash();}
log('系统初始化...','ok');log('当前角色:'+cur);
</script>
