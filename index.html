<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Segoe UI','Microsoft YaHei',sans-serif; overflow:hidden; height:100vh; width:100vw; }

#flash-overlay { position:fixed; inset:0; z-index:9997; pointer-events:none; opacity:0; transition:opacity 0.15s ease-out; }

#intro { position:fixed; inset:0; background:#000; z-index:9998; display:flex; justify-content:center; align-items:center; transition:opacity 0.6s ease; }
#intro-logo { position:absolute; width:240px; height:auto; opacity:0; filter:blur(12px); cursor:pointer; }

#app { display:none; height:100vh; width:100vw; flex-direction:column; position:relative; }
#mini-logo { position:fixed; top:8px; left:10px; height:32px; z-index:1000; display:none; cursor:pointer; }

/* === 顶部栏 === */
.topbar {
  height:72px;
  background:rgba(0,0,0,0.9);
  border-bottom:1px solid #330000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  gap:4px;
  padding:4px 0;
}
.topbar-title {
  font-size:15px;
  font-weight:900;
  font-style:italic;
  letter-spacing:3px;
  text-shadow:0 0 8px currentColor, 0 0 20px currentColor;
  transition:color 0.4s ease, text-shadow 0.4s ease;
  cursor:default;
  line-height:1;
}
/* === 歌词：发光 + 描边 === */
#lyric {
  font-size:12px;
  font-weight:700;
  font-style:italic;
  letter-spacing:1.5px;
  opacity:0.9;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:90vw;
  text-align:center;
  /* 发光 + 描边 */
  text-shadow:
    0 0 6px currentColor,
    0 0 14px currentColor,
    -1px -1px 0 rgba(0,0,0,0.8),
    1px -1px 0 rgba(0,0,0,0.8),
    -1px 1px 0 rgba(0,0,0,0.8),
    1px 1px 0 rgba(0,0,0,0.8);
  -webkit-text-stroke:0.4px currentColor;
  transition:color 0.4s ease, text-shadow 0.4s ease;
  line-height:1.2;
  margin-top:2px;
}

/* === 日志面板 === */
#log-panel { position:fixed; bottom:0; left:0; right:0; max-height:35vh; background:rgba(0,20,0,0.95); border-top:2px solid #0f0; z-index:9999; overflow-y:auto; display:none; padding:8px 10px; font-family:'Courier New',monospace; font-size:11px; color:#0f0; }
#log-panel.show { display:block; }
#log-panel .log-line { margin:1px 0; }
#log-panel .log-err { color:#f55; }
#log-panel .log-ok { color:#5f5; }
#log-panel .log-warn { color:#ff5; }

/* === 聊天区 === */
.chat { flex:1; overflow-y:auto; padding:76px 90px 70px 15px; display:flex; flex-direction:column; gap:14px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; position:relative; }
.chat::-webkit-scrollbar { width:5px; }
.chat::-webkit-scrollbar-thumb { background:#c00; border-radius:3px; }

/* === 制作者署名 === */
#credits {
  position:fixed;
  bottom:58px;
  left:12px;
  font-size:11px;
  font-weight:700;
  color:#ffffff;
  opacity:0.55;
  z-index:998;
  pointer-events:none;
  letter-spacing:0.5px;
  text-shadow:0 0 4px #000;
}

.msg { display:flex; gap:10px; max-width:85%; animation:msgIn .25s ease-out; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.av { width:42px; height:42px; border-radius:50%; border:2px solid #c00; object-fit:cover; flex-shrink:0; }

.name-nero { color:#4fc3f7 !important; }
.name-dante { color:#ff5252 !important; }
.name-vergil { color:#b0b0b0 !important; }

.bubble { background:#151515; border:1px solid #333; padding:10px 14px; border-radius:10px; line-height:1.65; font-size:16px; word-break:break-word; }
.bubble-nero { color:#4fc3f7; font-family:'Nunito','Segoe UI','Microsoft YaHei',sans-serif; font-weight:700; border-color:#1a4a6e; background:#0a1622; }
.bubble-dante { color:#ff5252; font-family:'Comic Sans MS','Segoe UI',sans-serif; font-style:italic; font-weight:600; border-color:#5a1a1a; background:#1a0a0a; }
.bubble-vergil { color:#e0e0e0; font-family:'Georgia','Times New Roman','Microsoft YaHei',serif; font-style:italic; letter-spacing:1.5px; border-color:#555; background:#0d0d0d; }
.msg.user .bubble { background:#c00; border-color:#f00; color:#fff; font-size:16px; font-weight:600; }

.input { position:fixed; bottom:0; left:0; right:80px; height:52px; display:flex; padding:8px 12px; gap:8px; border-top:1px solid #330000; background:rgba(0,0,0,0.95); z-index:999; }
.input input { flex:1; background:#111; border:1px solid #c00; color:#fff; padding:10px 12px; border-radius:4px; outline:none; font-size:15px; }
.input button { background:#c00; color:#fff; border:none; padding:0 18px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; flex-shrink:0; }
.input button:hover { background:#f00; }

.sidebar { position:fixed; right:0; top:72px; bottom:0; width:80px; background:rgba(10,0,0,.95); border-left:2px solid #c00; display:flex; flex-direction:column; align-items:center; padding-top:15px; gap:14px; z-index:500; overflow-y:auto; }
.sidebar::-webkit-scrollbar { display:none; }
.cbtn { width:56px; height:56px; border-radius:50%; border:3px solid #555; background-size:cover; background-position:center; cursor:pointer; opacity:.6; transition:.3s; flex-shrink:0; }
.cbtn.active { border-color:#c00; opacity:1; box-shadow:0 0 14px #c00; }
.cname { color:#fff; font-size:10px; margin-top:2px; text-align:center; }

#scroll-btn { position:fixed; bottom:60px; right:88px; width:36px; height:36px; border-radius:50%; background:rgba(200,0,0,0.8); color:#fff; border:none; font-size:18px; cursor:pointer; z-index:998; display:none; align-items:center; justify-content:center; box-shadow:0 0 8px #c00; }
#scroll-btn.show { display:flex; }

#mute-btn { position:fixed; bottom:60px; right:130px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.7); color:#fff; border:1px solid #c00; font-size:16px; cursor:pointer; z-index:998; display:flex; align-items:center; justify-content:center; }
#mute-btn:hover { background:rgba(200,0,0,0.5); }

/* === 曲目名：喇叭上方 === */
#now-playing {
  position:fixed;
  bottom:100px;
  right:130px;
  font-size:12px;
  font-weight:bold;
  font-style:italic;
  color:#fff;
  z-index:999;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.4s, color 0.4s ease;
  text-shadow:0 0 8px rgba(255,255,255,0.8), 0 0 16px rgba(255,255,255,0.5);
  max-width:200px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:right;
}
#now-playing.show { opacity:1; }

.dt-overlay { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #c00; box-shadow:inset 0 0 80px #c00; }
.dt-overlay.show { opacity:1; }
.dt-overlay-blue { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #00aaff; box-shadow:inset 0 0 80px #00aaff; }
.dt-overlay-blue.show { opacity:1; }

.style-pop { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) skewX(-10deg); font-family:'Cinzel Decorative','Times New Roman',serif; font-weight:900; z-index:500; pointer-events:none; animation:stylePop 1s ease-out forwards; text-shadow:0 0 12px currentColor,0 0 24px currentColor; }
@keyframes stylePop {
  0%{opacity:0;transform:translate(-50%,-50%) skewX(-10deg) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-50%) skewX(-10deg) scale(1.25)}
  35%{transform:translate(-50%,-50%) skewX(-10deg) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-60%) skewX(-10deg) scale(1)}
}
.style-sub { display:block; font-size:16px; font-weight:700; letter-spacing:2px; margin-top:4px; font-family:'Segoe UI','Microsoft YaHei',sans-serif; font-style:normal; transform:skewX(10deg); text-align:center; }
.style-d{color:#7a6a6a} .style-c{color:#ffae42} .style-b{color:#aaff00} .style-a{color:#00e5ff} .style-s{color:#ffd700} .style-ss{color:#ff6a00} .style-sss{color:#ff2d95}
.style-sss .style-sub { animation:shake 0.4s ease-in-out 2; }
@keyframes shake { 0%,100%{transform:skewX(10deg) translateX(0)} 25%{transform:skewX(10deg) translateX(-3px)} 75%{transform:skewX(10deg) translateX(3px)} }

.blood-flash { position:fixed; inset:0; z-index:199; pointer-events:none; background:rgba(200,0,0,.15); opacity:0; }
.blood-flash.show { animation:bloodFlash .35s ease-out; }
@keyframes bloodFlash { 0%{opacity:.6} 100%{opacity:0} }
</style>

<script>

var logPanel = document.getElementById('log-panel');
var logoTapCount = 0;
var lastTapTime = 0;

function bindLogoTap(el) {
  el.addEventListener('click', function() {
    var now = Date.now();
    if (now - lastTapTime < 350) {
      logoTapCount++;
      if (logoTapCount >= 2) {
        logPanel.classList.toggle('show');
        logoTapCount = 0;
        log('日志面板 ' + (logPanel.classList.contains('show') ? '打开' : '关闭'), 'ok');
      }
    } else {
      logoTapCount = 1;
      setTimeout(function() {
        if (logoTapCount === 1) {
          window.open('https://baike.baidu.com/item/%E9%AC%BC%E6%B3%A35/10364244', '_blank');
          log('跳转到百度百科 — 鬼泣5', 'ok');
        }
      }, 350);
    }
    lastTapTime = now;
  });
}
bindLogoTap(document.getElementById('mini-logo'));
bindLogoTap(document.getElementById('intro-logo'));

function log(msg, type) {
  var d = document.createElement('div');
  d.className = 'log-line' + (type ? ' log-' + type : '');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logPanel.appendChild(d);
  while (logPanel.children.length > 200) logPanel.removeChild(logPanel.firstChild);
  logPanel.scrollTop = logPanel.scrollHeight;
}

Object.keys(audios).forEach(function(k) {

    log(k + '.mp3 已加载, 时长:' + (a.duration ? a.duration.toFixed(1) + 's' : '未知'), a.duration > 0 ? 'ok' : 'warn');

});

function setVolumes() {
  Object.keys(audios).forEach(function(k) { audios[k].volume = isMuted ? 0 : 0.3; });
}

function forceUnlockAndPlay(role) {
  log('尝试强制解锁播放: ' + role);
  var target = audios[role];
  target.volume = 0;
  target.currentTime = 0;
  np.textContent = '♪ 缓冲中...';
  np.style.color = TRACK_NAMES[role].color;
  np.classList.add('show');
  var p = target.play();
  if (p && p.then) {
    p.then(function() {
      log('静音播放成功，恢复音量', 'ok');
      setTimeout(function() {
        target.volume = isMuted ? 0 : 0.3;
        if (!isMuted) {
          np.textContent = TRACK_NAMES[role].text;
          np.style.color = TRACK_NAMES[role].color;
        }
      }, 100);
    }).catch(function(e) { log('静音播放也失败: ' + e.name, 'err'); });
  }
}

function playRole(role) {
  log('切换歌曲: ' + role);
  Object.keys(audios).forEach(function(k) {
    if (k !== role) { audios[k].pause(); try { audios[k].currentTime = 0; } catch(e) {} }
  });
  // 先显示曲目名（不依赖播放结果）
  np.textContent = TRACK_NAMES[role].text;
  np.style.color = TRACK_NAMES[role].color;
  np.classList.add('show');

  var target = audios[role];
  target.volume = isMuted ? 0 : 0.3;
  try { target.currentTime = 0; } catch(e) {}
  var p = target.play();
  if (p && p.then) {
    p.then(function() {
      log('✅ 播放成功: ' + TRACK_NAMES[role].text, 'ok');
    }).catch(function(e) { log('❌ 播放失败（曲目名已显示）: ' + e.name, 'warn'); });
  }
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  log('音频解锁（用户手势）', 'ok');
  setVolumes();
  forceUnlockAndPlay(cur);
}

document.body.addEventListener('click', unlockAudio, { once: true });
document.body.addEventListener('touchstart', unlockAudio, { once: true });

function toggleMute() {
  isMuted = !isMuted;
  setVolumes();
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
  log('静音: ' + isMuted);
  if (!isMuted && audioUnlocked) playRole(cur);
}

// ========== Logo 动画 ==========
var intro = document.getElementById('intro');
var logo = document.getElementById('intro-logo');
var mini = document.getElementById('mini-logo');
var app = document.getElementById('app');
var chat = document.getElementById('chat');
var scrollBtn = document.getElementById('scroll-btn');

var p = 0;
var sx = innerWidth / 2;
var sy = innerHeight / 2;
var ex = 26;
var ey = 24;

function ease(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

function tick() {
  p += 0.018;
  if (p >= 1) p = 1;
  var e = ease(p);
  logo.style.left = (sx + (ex-sx)*e - 120) + "px";
  logo.style.top = (sy + (ey-sy)*e - 25) + "px";
  logo.style.opacity = e;
  logo.style.filter = "blur(" + ((1-e)*12) + "px)";
  logo.style.transform = "scale(" + (1 - e*0.83) + ")";
  if (p < 1) requestAnimationFrame(tick);
  else {
    intro.style.opacity = 0;
    setTimeout(function() {
      intro.style.display = 'none';
      app.style.display = 'flex';
      mini.style.display = 'block';
      updateTitleColor(cur);
      say(cur, intros[cur], false);
      log('页面就绪', 'ok');
    }, 600);
  }
}

function startApp() {
  logo.style.left = (sx-120) + "px";
  logo.style.top = (sy-25) + "px";
  setTimeout(function() {
    logo.style.opacity = 1;
    requestAnimationFrame(tick);
    log('Logo 动画开始', 'ok');
  }, 300);
}

};

var bubbleClass = { nero:"bubble-nero", dante:"bubble-dante", vergil:"bubble-vergil" };
var nameClass = { nero:"name-nero", dante:"name-dante", vergil:"name-vergil" };

var STYLE_TABLE = [
  { g:"D", sub:"Dismal 糟糕的", cls:"style-d" },
  { g:"C", sub:"Crazy 疯狂", cls:"style-c" },
  { g:"B", sub:"Badass 狠角色", cls:"style-b" },
  { g:"A", sub:"Apocalyptic 末日般的", cls:"style-a" },
  { g:"S", sub:"Savage! 残忍", cls:"style-s" },
  { g:"SS", sub:"Sick Skills!! 致命的技术", cls:"style-ss" },
  { g:"SSS", sub:"Smokin' Sexy Style!!! 帅到爆炸", cls:"style-sss" }
];

function stylePop(inputLen, replyText) {
  var score = Math.min(60, inputLen * 2);
  var keywords = ['力量','恶魔','阎魔刀','斯巴达','魔界','Devil Trigger','Jackpot','Yahoo','Style','姬莉叶','妮可','尼禄','但丁','维吉尔'];
  var kwCount = 0;
  keywords.forEach(function(k) { if(replyText.indexOf(k) !== -1) kwCount++; });
  score += Math.min(40, kwCount * 8 + Math.min(20, replyText.length / 10));
  score = Math.min(100, Math.max(0, score));
  var idx = score<15?0:score<30?1:score<45?2:score<60?3:score<75?4:score<90?5:6;
  var s = STYLE_TABLE[idx];
  var pop = document.createElement('div');
  pop.className = 'style-pop ' + s.cls;
  pop.style.fontSize = (s.g.length>1?64:88)+"px";
  pop.innerHTML = s.g + '<span class="style-sub">' + s.sub + '</span>';
  document.body.appendChild(pop);
  setTimeout(function(){ pop.remove(); }, 1000);
}

function scrollToBottom() { chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'}); }
function checkScrollBtn() {
  if(chat.scrollTop < chat.scrollHeight - chat.clientHeight - 60) scrollBtn.classList.add('show');
  else scrollBtn.classList.remove('show');
}
chat.addEventListener('scroll', checkScrollBtn);

function typeText(el, text, speed, onDone) {
  el.textContent = "";
  var i = 0;
  (function next() {
    if(i < text.length) { el.textContent += text[i++]; chat.scrollTop = chat.scrollHeight; setTimeout(next, speed); }
    else { requestAnimationFrame(function(){ chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'}); checkScrollBtn(); if(onDone) onDone(); }); }
  })();
}

function say(role, text, isUser) {
  var d = document.createElement('div');
  d.className = 'msg' + (isUser ? ' user' : '');
  if(isUser) d.innerHTML = '<img class="av" src="https://placehold.co/100x100/333/fff?text=Me"><div><div class="name">You</div><div class="bubble"></div></div>';
  else d.innerHTML = '<img class="av" src="' + avs[role] + '"><div><div class="name ' + nameClass[role] + '">' + role.charAt(0).toUpperCase()+role.slice(1) + '</div><div class="bubble ' + bubbleClass[role] + '"></div></div>';
  chat.appendChild(d);
  chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});
  if(!isUser) typeText(d.querySelector('.bubble'), text, 28);
  else d.querySelector('.bubble').textContent = text;
}

async function callAI(role, msg) {
  if (!API_KEY) return "（未设置 API Key）";
  var last = "";
  for (var i = 0; i < API_ENDPOINTS.length; i++) {
    try {
      var ctl = new AbortController();
      var to = setTimeout(function(){ ctl.abort(); }, 25000);
      var res = await fetch(API_ENDPOINTS[i], {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
        body: JSON.stringify({ model: MODEL, messages: [{ role:"system", content: prompts[role] }, { role:"user", content: msg }], max_tokens: 300, temperature: 0.9 }),
        signal: ctl.signal
      });
      clearTimeout(to);
      var data = await res.json();
      if (data.error) { last = data.error.message || JSON.stringify(data.error); if(/token|key|auth/i.test(last)) return "（API 错误："+last+"）"; continue; }
      return data.choices ? data.choices[0].message.content : "（魔界通讯中断…）";
    } catch(e) { last = e.name === 'AbortError' ? "请求超时" : e.message; continue; }
  }
  return "（所有接口都失败了：" + last + "）";
}

async function send() {
  var ui = document.getElementById('ui');
  var t = ui.value.trim();
  if(!t) return;
  say('you', t, true);
  ui.value = '';
  bloodFlash();
  var temp = document.createElement('div');
  temp.className = 'msg';
  temp.innerHTML = '<img class="av" src="' + avs[cur] + '"><div><div class="name ' + nameClass[cur] + '">' + cur + '</div><div class="bubble ' + bubbleClass[cur] + '" style="color:#888;font-style:normal">思考中...</div></div>';
  chat.appendChild(temp);
  chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});
  var reply = await callAI(cur, t);
  temp.querySelector('.bubble').textContent = "";
  temp.querySelector('.bubble').style.color = "";
  temp.querySelector('.bubble').style.fontStyle = "";
  typeText(temp.querySelector('.bubble'), reply, 28, function(){ stylePop(t.length, reply); });
}

function sw(c) {
  if(cur === c) return;
  cur = c;
  document.querySelectorAll('.cbtn').forEach(function(x){ x.classList.remove('active'); });
  document.getElementById('b-'+c).classList.add('active');
  chat.innerHTML = '';
  say(c, intros[c], false);
  scrollBtn.classList.remove('show');
  updateTitleColor(c);
  flashPage(c);
  if(audioUnlocked) playRole(c);
}

var pressTimer = null;
var pressStart = 0;
function bindDT(id, role) {
  var b = document.getElementById(id);
  b.addEventListener('touchstart', function(e){ e.preventDefault(); pressStart=Date.now(); pressTimer=setTimeout(function(){ triggerDT(role); },1500); });
  b.addEventListener('touchend', function(e){ e.preventDefault(); clearTimeout(pressTimer); if(Date.now()-pressStart<500) sw(role); });
  b.addEventListener('mousedown', function(e){ e.preventDefault(); pressStart=Date.now(); pressTimer=setTimeout(function(){ triggerDT(role); },1500); });
  b.addEventListener('mouseup', function(){ clearTimeout(pressTimer); if(Date.now()-pressStart<500) sw(cur); });
  b.addEventListener('mouseleave', function(){ clearTimeout(pressTimer); });
}
function triggerDT(role) {
  var o = role==='dante' ? document.getElementById('dt-red') : document.getElementById('dt-blue');
  o.classList.add('show');
  setTimeout(function(){ o.classList.remove('show'); }, 800);
  say(role, dtLines[role], false);
}
bindDT('b-nero','nero');
bindDT('b-dante','dante');
bindDT('b-vergil','vergil');

function bloodFlash() {
  var f = document.createElement('div');
  f.className = 'blood-flash show';
  document.body.appendChild(f);
  setTimeout(function(){ f.remove(); }, 400);
}
