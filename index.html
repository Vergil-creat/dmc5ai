<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DEVIL MAY CRY 5 — AI CHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;width:100vw}
#flash-overlay{position:fixed;inset:0;z-index:9997;pointer-events:none;opacity:0;transition:opacity .15s}
#intro{position:fixed;inset:0;background:#000;z-index:9998;display:flex;justify-content:center;align-items:center;transition:opacity .6s}
#intro-logo{position:absolute;width:240px;height:auto;opacity:0;filter:blur(12px);cursor:pointer}
#app{display:none;height:100vh;width:100vw;flex-direction:column;position:relative}
#mini-logo{position:fixed;top:8px;left:10px;height:32px;z-index:1000;display:none;cursor:pointer}
.topbar{height:72px;background:rgba(0,0,0,.9);border-bottom:1px solid #330;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;gap:4px;padding:4px 0;z-index:1000}
.topbar-title{font-size:15px;font-weight:900;font-style:italic;letter-spacing:3px;text-shadow:0 0 8px currentColor,0 0 20px currentColor;transition:color .4s,text-shadow .4s;cursor:default;line-height:1}
#lyric{font-size:12px;font-weight:700;font-style:italic;letter-spacing:1.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90vw;text-align:center;text-shadow:0 0 6px currentColor,0 0 14px currentColor,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;-webkit-text-stroke:.4px currentColor;transition:color .4s,text-shadow .4s;line-height:1.2;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:10px 90px 10px 15px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;z-index:10}
.chat::-webkit-scrollbar{width:5px}.chat::-webkit-scrollbar-thumb{background:#c00;border-radius:3px}
#credits{position:fixed;bottom:58px;left:12px;font-size:11px;font-weight:700;color:#fff;opacity:.55;z-index:998;pointer-events:none;letter-spacing:.5px;text-shadow:0 0 4px #000}
.msg{display:flex;gap:10px;max-width:85%;animation:msgIn .25s ease-out}.msg.user{align-self:flex-end;flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.av{width:42px;height:42px;border-radius:50%;border:2px solid #c00;object-fit:cover;flex-shrink:0;cursor:pointer}
.name-nero{color:#4fc3f7!important}.name-dante{color:#ff5252!important}.name-vergil{color:#b0b0b0!important}
.bubble{background:#151515;border:1px solid #333;padding:10px 14px;border-radius:10px;line-height:1.65;font-size:16px;word-break:break-word}
.bubble-nero{color:#4fc3f7;font-family:'Nunito','Segoe UI',sans-serif;font-weight:700;border-color:#1a4a6e;background:#0a1622}
.bubble-dante{color:#ff5252;font-family:'Comic Sans MS','Segoe UI',sans-serif;font-style:italic;font-weight:600;border-color:#5a1a1a;background:#1a0a0a}
.bubble-vergil{color:#e0e0e0;font-family:'Georgia','Times New Roman',serif;font-style:italic;letter-spacing:1.5px;border-color:#555;background:#0d0d0d}
.msg.user .bubble{background:#c00;border-color:#f00;color:#fff;font-size:16px;font-weight:600}
.input{position:fixed;bottom:0;left:0;right:80px;height:52px;display:flex;padding:8px 12px;gap:8px;border-top:1px solid #330;background:rgba(0,0,0,.95);z-index:999}
.input input{flex:1;background:#111;border:1px solid #c00;color:#fff;padding:10px 12px;border-radius:4px;outline:none;font-size:15px}
.input button{background:#c00;color:#fff;border:none;padding:0 18px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px;flex-shrink:0}
.input button:hover{background:#f00}
.sidebar{position:fixed;right:0;top:72px;width:80px;height:calc(100vh - 72px - 52px);display:flex;flex-direction:column;align-items:center;padding-top:15px;gap:14px;z-index:500;overflow:visible}
.cbtn{width:56px;height:56px;border-radius:50%;border:3px solid #555;background-size:cover;background-position:center;cursor:pointer;opacity:.6;transition:.3s;flex-shrink:0}
.cbtn.active{border-color:#c00;opacity:1;box-shadow:0 0 14px #c00}
.cname{color:#fff;font-size:10px;margin-top:2px;text-align:center}
/* 武器：放大 + 不裁边 */
#weapon-container{position:fixed;right:0;top:calc(72px + 188px);width:80px;bottom:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;pointer-events:none;overflow:visible;padding-bottom:4px}
#weapon-img{max-width:98%;max-height:95%;width:auto;height:auto;object-fit:contain;border:3px solid #b0b0b0;border-radius:6px;opacity:0;transform:scale(.85) rotate(-2deg);transition:opacity .5s,transform .5s,filter .4s,border-color .4s;pointer-events:auto;cursor:pointer}
#weapon-img.show{opacity:.95;transform:scale(1) rotate(0deg)}
#weapon-glow{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:60px;height:20px;opacity:0;transition:opacity .5s,background .4s;pointer-events:none}
#weapon-glow.show{opacity:1}
#weapon-fly{position:fixed;width:80px;height:auto;pointer-events:none;z-index:450;opacity:0;display:none}
.fire-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:449;opacity:0}
#scroll-btn{position:fixed;bottom:60px;right:88px;width:36px;height:36px;border-radius:50%;background:rgba(200,0,0,.8);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:998;display:none;align-items:center;justify-content:center;box-shadow:0 0 8px #c00}
#scroll-btn.show{display:flex}
#mute-btn{position:fixed;bottom:60px;right:130px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:1px solid #c00;font-size:16px;cursor:pointer;z-index:998;display:flex;align-items:center;justify-content:center}
#mute-btn:hover{background:rgba(200,0,0,.5)}
#now-playing{position:fixed;bottom:100px;right:130px;font-size:12px;font-weight:bold;font-style:italic;color:#fff;z-index:999;pointer-events:none;opacity:0;transition:opacity .4s,color .4s;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#now-playing.show{opacity:1}
.dt-overlay{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;transition:opacity .3s;border:4px solid #c00;box-shadow:inset 0 0 80px #c00}
.dt-overlay.show{opacity:1}
.dt-overlay-blue{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;transition:opacity .3s;border:4px solid #0af;box-shadow:inset 0 0 80px #0af}
.dt-overlay-blue.show{opacity:1}
.style-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) skewX(-10deg);font-family:'Cinzel Decorative',serif;font-weight:900;z-index:500;pointer-events:none;animation:stylePop 1s ease-out forwards;text-shadow:0 0 12px currentColor,0 0 24px currentColor}
@keyframes stylePop{0%{opacity:0;transform:translate(-50%,-50%) skewX(-10deg) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) skewX(-10deg) scale(1.25)}35%{transform:translate(-50%,-50%) skewX(-10deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) skewX(-10deg) scale(1)}}
.style-sub{display:block;font-size:16px;font-weight:700;letter-spacing:2px;margin-top:4px;font-family:'Segoe UI',sans-serif;font-style:normal;transform:skewX(10deg);text-align:center}
.style-d{color:#7a6a6a}.style-c{color:#fa0}.style-b{color:#af0}.style-a{color:#0ef}.style-s{color:#fd0}.style-ss{color:#f60}.style-sss{color:#f2d}
.style-sss .style-sub{animation:shake .4s ease-in-out 2}
@keyframes shake{0%,100%{transform:skewX(10deg) translateX(0)}25%{transform:skewX(10deg) translateX(-3px)}75%{transform:skewX(10deg) translateX(3px)}}
.blood-flash{position:fixed;inset:0;z-index:199;pointer-events:none;background:rgba(200,0,0,.15);opacity:0}
.blood-flash.show{animation:bloodFlash .35s ease-out}
@keyframes bloodFlash{0%{opacity:.6}100%{opacity:0}}
</style>
</head>
<body>
<div id="flash-overlay"></div>
<audio id="aud-nero" preload="metadata" src="nero.mp3"></audio>
<audio id="aud-dante" preload="metadata" src="dante.mp3"></audio>
<audio id="aud-vergil" preload="metadata" src="vergil.mp3"></audio>
<div id="intro"><img id="intro-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp"></div>
<img id="mini-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp">
<img id="weapon-fly" src="" alt="">
<div id="fire-layer"></div>
<div id="app">
<div class="topbar"><div class="topbar-title" id="top-title">DEVIL MAY CRY 5 — AI CHAT</div><div id="lyric"></div></div>
<div class="chat" id="chat"></div>
<div id="weapon-container"><div id="weapon-glow"></div><img id="weapon-img" src="" alt="weapon"></div>
<div id="credits">制作者：一庭霜月满襟寒（bilibili）</div>
<button id="scroll-btn" onclick="scrollToBottom()">↓</button>
<div id="now-playing"></div>
<button id="mute-btn" onclick="toggleMute()">🔊</button>
<div class="input"><input id="ui" placeholder="输入你的话语..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>
<div class="sidebar">
<div class="cbtn" id="b-nero" style="background-image:url('https://i.postimg.cc/2yXv0dfR/ab0e3d8b0d10b13ee56e113eadd1e3e83700043f2f7bba201a49bc3e30884537-0.jpg')" onclick="sw('nero')"></div><div class="cname">Nero</div>
<div class="cbtn" id="b-dante" style="background-image:url('https://i.postimg.cc/MHrR908Q/1771934129984.jpg')" onclick="sw('dante')"></div><div class="cname">Dante</div>
<div class="cbtn" id="b-vergil" style="background-image:url('https://i.postimg.cc/x8FH6GSm/1771934121143.jpg')" onclick="sw('vergil')"></div><div class="cname">Vergil</div>
</div>
</div>
<div class="dt-overlay" id="dt-red"></div>
<div class="dt-overlay-blue" id="dt-blue"></div>
<script>
var API_KEY="sk-5Jg72uXUHod43eEUQOssxpIxp8mbmFCk6u3REqHAJehTO07z".trim();
var API_ENDPOINTS=["https://speed.toter.me/v1/chat/completions","https://api.supxh.xin/v1/chat/completions"];
var MODEL="gemini-3-flash";
var WEAPON_IMGS={
vergil:"yamato.png",
nero:"https://i.postimg.cc/BvGsMmcz/aebf56b3276a71fdea06b9e5abb942d88293704cafd5ea7544f3aa7f85e96a1d-0.png",
dante:"https://i.postimg.cc/s2RywT90/d7bb84ad07891cb9c5fa4bdaacf4a962c2964e974fa890e552838041fa997203-0.jpg"
};
var WEAPON_BORDERS={nero:"#4fc3f7",dante:"#ff5252",vergil:"#b0b0b0"};
var WEAPON_GLOWS={nero:"radial-gradient(ellipse,rgba(79,195,247,.25) 0%,transparent 70%)",dante:"radial-gradient(ellipse,rgba(255,82,82,.25) 0%,transparent 70%)",vergil:"radial-gradient(ellipse,rgba(176,176,176,.25) 0%,transparent 70%)"};
var WEAPON_SHADOWS={nero:"drop-shadow(0 0 8px rgba(79,195,247,.7)) drop-shadow(0 0 16px rgba(79,195,247,.3))",dante:"drop-shadow(0 0 8px rgba(255,82,82,.7)) drop-shadow(0 0 16px rgba(255,82,82,.3))",vergil:"drop-shadow(0 0 8px rgba(176,176,176,.7)) drop-shadow(0 0 16px rgba(255,255,255,.3))"};
function updateWeapon(role){var img=document.getElementById('weapon-img'),glow=document.getElementById('weapon-glow');img.classList.remove('show');glow.classList.remove('show');setTimeout(function(){img.src=WEAPON_IMGS[role];img.style.filter=WEAPON_SHADOWS[role];img.style.borderColor=WEAPON_BORDERS[role];glow.style.background=WEAPON_GLOWS[role];img.onload=function(){img.classList.add('show');glow.classList.add('show');};img.onerror=function(){img.alt='[加载失败:'+role+']';img.classList.add('show');};},250);}
/* 火焰拖尾：尼禄武器点击触发 */
var weaponAnimating=false;
document.getElementById('weapon-img').addEventListener('click',function(){if(cur==='nero'&&!weaponAnimating)fireEgg();});
function fireEgg(){
weaponAnimating=true;
var fly=document.getElementById('weapon-fly');
var staticImg=document.getElementById('weapon-img');
var rect=staticImg.getBoundingClientRect();
var sx=rect.left+rect.width/2,sy=rect.top+rect.height/2;
fly.src=WEAPON_IMGS.nero;
fly.style.display='block';
fly.style.left=sx+'px';fly.style.top=sy+'px';
fly.style.width=rect.width+'px';
fly.style.marginLeft=(-rect.width/2)+'px';fly.style.marginTop=(-rect.height/2)+'px';
fly.style.opacity='1';fly.style.transition='none';fly.style.transform='rotate(0deg)';
staticImg.style.opacity='0';
fly.offsetWidth;
var dur=900;
fly.style.transition='left '+dur+'ms cubic-bezier(.4,0,.2,1), opacity 300ms ease '+(dur-300)+'ms, transform '+dur+'ms ease';
fly.style.left=(innerWidth+120)+'px';fly.style.transform='rotate(15deg)';fly.style.opacity='0';
var layer=document.getElementById('fire-layer');layer.innerHTML='';
for(var i=0;i<24;i++){(function(i){
var p=document.createElement('div');p.className='fire-particle';
var delay=Math.random()*180,life=400+Math.random()*400;
var size=8+Math.random()*10;
p.style.width=size+'px';p.style.height=size+'px';
p.style.left=sx+'px';p.style.top=(sy+(Math.random()-.5)*36)+'px';
p.style.background=i%2==0?'radial-gradient(circle,#fff 0%,#ffd700 30%,#ff6a00 60%,transparent 100%)':'radial-gradient(circle,#fff 0%,#4fc3f7 40%,transparent 100%)';
p.style.boxShadow=i%2==0?'0 0 8px #ff6a00,0 0 16px #ff2d00':'0 0 8px #4fc3f7,0 0 16px #4fc3f7';
layer.appendChild(p);p.offsetWidth;
p.style.transition='left '+life+'ms linear '+delay+'ms, top '+life+'ms ease-in '+delay+'ms, opacity 300ms ease '+(delay+life-300)+'ms, width 500ms ease, height 500ms ease';
p.style.left=(sx+(innerWidth-sx)*.75+Math.random()*80)+'px';
p.style.top=(sy+(Math.random()-.5)*30)+'px';
p.style.opacity='0';p.style.width=(size*.3)+'px';p.style.height=(size*.3)+'px';
setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},delay+life+100);
})(i);}
setTimeout(function(){fly.style.display='none';fly.style.left='0px';fly.style.opacity='0';staticImg.style.opacity='';weaponAnimating=false;},dur+100);
}
/* 其余交互（标题色/歌词/BGM/对话/Style/魔人化）保留你上一版逻辑 */
var cur="vergil";
var TITLE_COLORS={nero:"#ffffff",dante:"#ff5252",vergil:"#4fc3f7"};
var LYRICS={nero:"Bang, bang, bang — Pull my Devil Trigger",dante:"You cannot kill me! I am Subhuman!",vergil:"I am the storm that is approaching"};
function updateTitleColor(role){document.getElementById('top-title').style.color=TITLE_COLORS[role];var l=document.getElementById('lyric');l.style.color=TITLE_COLORS[role];l.textContent=LYRICS[role];updateWeapon(role);}
var audios={nero:document.getElementById('aud-nero'),dante:document.getElementById('aud-dante'),vergil:document.getElementById('aud-vergil')};
var audioUnlocked=false,isMuted=false;
var np=document.getElementById('now-playing'),muteBtn=document.getElementById('mute-btn');
function setVolumes(){Object.keys(audios).forEach(function(k){audios[k].volume=isMuted?0:0.3;});}
function playRole(role){Object.keys(audios).forEach(function(k){if(k!==role){audios[k].pause();try{audios[k].currentTime=0;}catch(e){}}});np.textContent=role==='nero'?"♪ Nero — Devil Trigger":role==='dante'?"♪ Dante — Subhuman":"♪ Vergil — Bury the Light";np.style.color=TITLE_COLORS[role];np.classList.add('show');var t=audios[role];t.volume=isMuted?0:0.3;try{t.currentTime=0;}catch(e){}var p=t.play();if(p&&p.then)p.catch(function(){});}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;setVolumes();playRole(cur);}
document.body.addEventListener('click',unlockAudio,{once:true});
document.body.addEventListener('touchstart',unlockAudio,{once:true});
function toggleMute(){isMuted=!isMuted;setVolumes();muteBtn.textContent=isMuted?'🔇':'🔊';if(!isMuted&&audioUnlocked)playRole(cur);}
function sw(c){if(cur===c)return;cur=c;document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('active');});document.getElementById('b-'+c).classList.add('active');updateTitleColor(c);if(audioUnlocked)playRole(c);}
var chat=document.getElementById('chat');
function say(role,text){var d=document.createElement('div');d.className='msg'+(role==='you'?' user':'');if(role==='you')d.innerHTML='<img class="av" src="https://placehold.co/100x100/333/fff?text=Me"><div><div class="name">You</div><div class="bubble"></div></div>';else d.innerHTML='<img class="av" src="'+(role==='nero'?"https://i.postimg.cc/2yXv0dfR/ab0e3d8b0d10b13ee56e113eadd1e3e83700043f2f7bba201a49bc3e30884537-0.jpg":role==='dante'?"https://i.postimg.cc/MHrR908Q/1771934129984.jpg":"https://i.postimg.cc/x8FH6GSm/1771934121143.jpg")+'"><div><div class="name name-'+role+'">'+role.charAt(0).toUpperCase()+role.slice(1)+'</div><div class="bubble bubble-'+role+'"></div></div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;d.querySelector('.bubble').textContent=text;}
function send(){var ui=document.getElementById('ui');var t=ui.value.trim();if(!t)return;say('you',t);ui.value='';say(cur,'（思考中…）');}
updateTitleColor(cur);
</script>
</body>
</html>
