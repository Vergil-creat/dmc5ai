<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>DEVIL MAY CRY 5 — AI CHAT</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body {
  background:#000; color:#fff;
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  overflow:hidden; height:100vh; width:100vw;
  -webkit-user-drag:none; user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
body { position:fixed; top:0; left:0; right:0; bottom:0; }

/* 日志 */
#log-panel { position:fixed; bottom:0; left:0; right:0; max-height:35vh; background:rgba(0,20,0,0.95); border-top:2px solid #0f0; z-index:9999; overflow-y:auto; display:none; padding:8px 10px; font-family:'Courier New',monospace; font-size:11px; color:#0f0; }
#log-panel.show { display:block; }
.log-line { margin:1px 0; } .log-err { color:#f55; } .log-ok { color:#5f5; } .log-warn { color:#ff5; }

/* 开场 */
#intro { position:fixed; inset:0; background:#000; z-index:9998; display:flex; justify-content:center; align-items:center; transition:opacity 0.6s ease; }
#intro-logo { position:absolute; width:240px; height:auto; opacity:0; filter:blur(12px); cursor:pointer; }

/* 主界面 */
#app { display:none; height:100vh; width:100vw; flex-direction:column; position:relative; }
#mini-logo { position:fixed; top:8px; left:10px; height:32px; z-index:1000; display:none; cursor:pointer; }

/* 顶部栏 */
.topbar { height:72px; background:rgba(0,0,0,0.9); border-bottom:1px solid #330000; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; gap:4px; padding:4px 0; }
.topbar-title { font-size:15px; font-weight:900; font-style:italic; letter-spacing:3px; text-shadow:0 0 8px currentColor,0 0 20px currentColor; transition:color .4s,text-shadow .4s; cursor:default; line-height:1; }
#lyric { font-size:12px; font-weight:700; font-style:italic; letter-spacing:1.5px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90vw; text-align:center; text-shadow:0 0 6px currentColor,0 0 14px currentColor,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; -webkit-text-stroke:.4px currentColor; transition:color .4s,text-shadow .4s; line-height:1.2; margin-top:2px; }

/* 红魂 */
#orb-wrapper { position:fixed; top:10px; right:10px; z-index:1001; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.75); border:1px solid #550000; border-radius:18px; padding:4px 12px 4px 6px; box-shadow:0 0 10px rgba(255,0,0,0.3); }
#orb-container { width:28px; height:28px; border-radius:50%; overflow:hidden; box-shadow:0 0 8px #ff2200, inset 0 0 10px rgba(255,50,0,0.6); animation:orbPulse 2s ease-in-out infinite; flex-shrink:0; }
#orb-container img { width:100%; height:100%; object-fit:cover; display:block; }
@keyframes orbPulse { 0%,100%{transform:scale(1);filter:brightness(1);} 50%{transform:scale(1.12);filter:brightness(1.3);} }
#orb-count { font-size:16px; font-weight:900; color:#ff4444; text-shadow:0 0 6px #ff0000,0 0 12px #ff0000; font-family:'Courier New',monospace; }
.orb-fly-particle { position:fixed; width:20px; height:20px; border-radius:50%; overflow:hidden; pointer-events:none; z-index:2000; box-shadow:0 0 6px #ff2200; filter:blur(2px); opacity:0.9; }
.orb-fly-particle img { width:100%; height:100%; object-fit:cover; display:block; }

/* Style 侧边 */
#style-container { position:fixed; right:6px; top:50%; transform:translateY(-50%); z-index:1001; display:none; flex-direction:column; align-items:center; pointer-events:none; opacity:0; transition:opacity .4s; }
#style-container.show { display:flex; opacity:1; }
#style-grade { font-family:'Cinzel Decorative',serif; font-weight:900; font-size:52px; line-height:1; text-shadow:0 0 12px currentColor,0 0 24px currentColor,0 0 36px currentColor; transition:transform .35s,color .3s; color:#888; }
#style-grade.pop { transform:scale(1.55); }
#style-sub { font-size:10px; font-weight:700; letter-spacing:1.5px; margin-top:2px; text-align:center; text-shadow:0 0 6px currentColor; transition:color .3s; color:#888; }
#style-sub.pop { transform:scale(1.2); }

/* ===== 玻璃龟裂（SVG有机裂纹 + 多层景深） ===== */
#glass-crack-overlay {
  position:fixed; inset:0; z-index:99997; pointer-events:none;
  display:none; opacity:0; transition:opacity .3s ease-out;
}
#glass-crack-overlay.show { display:block; opacity:1; }
#glass-crack-overlay svg { width:100%; height:100%; position:absolute; inset:0; }
/* 屏幕震动 */
@keyframes screenShake { 0%,100%{transform:translate(0)} 20%{transform:translate(-2px,1px)} 40%{transform:translate(2px,-1px)} 60%{transform:translate(-1px,2px)} 80%{transform:translate(1px,-2px)} }
body.shake { animation:screenShake 0.3s ease-out; }

/* ===== 结算面板（图1布局） ===== */
#result-overlay {
  position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.9);
  display:none; align-items:center; justify-content:center;
}
#result-overlay.show { display:flex; }
#result-panel {
  width:92vw; max-width:540px; min-height:360px;
  background:radial-gradient(ellipse at 30% 50%, rgba(50,0,0,0.35) 0%, transparent 60%), #080808;
  border:1px solid #220808;
  box-shadow:0 0 50px rgba(150,0,0,0.2), inset 0 0 30px rgba(60,0,0,0.1);
  padding:26px 30px; position:relative; overflow:hidden;
  transform:scale(0.93); opacity:0; transition:transform .45s cubic-bezier(.22,.61,.36,1), opacity .35s ease;
}
#result-overlay.show #result-panel { transform:scale(1); opacity:1; }

.result-top-label { font-size:10px; color:#555; letter-spacing:8px; text-transform:uppercase; margin-bottom:4px; opacity:0; animation:rfade .4s .15s forwards; }
.result-stage-name { font-size:12px; color:#777; letter-spacing:2px; margin-bottom:16px; opacity:0; animation:rfade .4s .25s forwards; }
@keyframes rfade { to{opacity:1} }

.result-body { display:flex; align-items:stretch; gap:28px; opacity:0; animation:rfade .5s .4s forwards; }
.result-left { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:1px solid #151515; padding-right:28px; }
.result-clear-text { font-size:16px; font-weight:900; color:#cc0000; letter-spacing:5px; text-shadow:0 0 10px #ff0000,0 0 20px #660000; margin-bottom:2px; }
.result-big-grade { font-family:'Cinzel Decorative',serif; font-weight:900; font-size:110px; line-height:.82; text-shadow:0 0 18px currentColor,0 0 36px currentColor,0 0 54px currentColor; }
.result-big-sub { font-size:13px; font-weight:700; letter-spacing:2px; margin-top:4px; text-shadow:0 0 6px currentColor; }
.result-new-record { display:none; margin-top:6px; font-size:10px; font-weight:900; color:#ffd700; letter-spacing:3px; text-shadow:0 0 8px #ffd700; animation:goldShine 2s ease-in-out infinite; }
.result-new-record.show { display:block; }
@keyframes goldShine { 0%,100%{opacity:.5} 50%{opacity:1} }

.result-right { flex:1; display:flex; flex-direction:column; justify-content:center; gap:11px; }
.result-data-row { display:flex; align-items:center; gap:10px; opacity:0; animation:rSlide .35s ease-out forwards; }
.result-data-row:nth-child(1){animation-delay:.55s} .result-data-row:nth-child(2){animation-delay:.65s}
.result-data-row:nth-child(3){animation-delay:.75s} .result-data-row:nth-child(4){animation-delay:.85s}
.result-data-row:nth-child(5){animation-delay:.95s}
@keyframes rSlide { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:translateX(0)} }
.rd-label { font-size:10px; color:#555; width:82px; text-align:right; letter-spacing:1px; flex-shrink:0; }
.rd-bar-wrap { flex:1; height:13px; background:#080808; border:1px solid #1a1a1a; overflow:hidden; }
.rd-bar { height:100%; width:0; transition:width 1.2s cubic-bezier(.22,.61,.36,1); }
.rd-bar.orbs { background:linear-gradient(90deg,#ff4400,#ffaa00); box-shadow:0 0 5px #ff6600; }
.rd-bar.combo { background:linear-gradient(90deg,#ff2200,#ff6600); box-shadow:0 0 5px #ff3300; }
.rd-bar.msgs { background:linear-gradient(90deg,#00aaff,#00ffcc); box-shadow:0 0 5px #00aaff; }
.rd-bar.time { background:linear-gradient(90deg,#aa44ff,#ff44aa); box-shadow:0 0 5px #aa44ff; }
.rd-bar.stylish { background:linear-gradient(90deg,#ffd700,#ff6a00); box-shadow:0 0 5px #ffd700; }
.rd-value { font-size:13px; font-weight:900; font-family:'Courier New',monospace; color:#fff; min-width:60px; text-align:right; text-shadow:0 0 4px currentColor; }

/* 台词 */
.result-quote-section { margin-top:16px; padding-top:12px; border-top:1px solid #151515; opacity:0; animation:rfade .5s 1.2s forwards; }
.result-quote-text { font-size:12px; font-style:italic; line-height:1.6; }
.result-quote-trans { font-size:11px; font-weight:600; line-height:1.5; margin-top:2px; }
.result-quote-by { font-size:10px; color:#444; margin-top:3px; }

.result-bottom-hint { text-align:center; font-size:10px; color:#333; margin-top:14px; letter-spacing:2px; opacity:0; animation:rfade .4s 1.5s forwards; }

/* 聊天 */
.chat { flex:1; overflow-y:auto; padding:10px 90px 70px 15px; display:flex; flex-direction:column; gap:14px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.chat::-webkit-scrollbar { width:5px; } .chat::-webkit-scrollbar-thumb { background:#c00; border-radius:3px; }
.msg { display:flex; gap:10px; max-width:85%; animation:msgIn .25s ease-out; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.av { width:42px; height:42px; border-radius:50%; border:2px solid #c00; object-fit:cover; flex-shrink:0; }
.name-nero{color:#4fc3f7!important} .name-dante{color:#ff5252!important} .name-vergil{color:#80c0ff!important} .name-v{color:#c876ff!important}
.bubble { background:#151515; border:1px solid #333; padding:10px 14px; border-radius:10px; line-height:1.65; font-size:16px; word-break:break-word; }
.bubble-nero { color:#4fc3f7; font-family:'Nunito','Segoe UI',sans-serif; font-weight:700; border-color:#1a4a6e; background:#0a1622; }
.bubble-dante { color:#ff5252; font-family:'Comic Sans MS','Segoe UI',sans-serif; font-style:italic; font-weight:600; border-color:#5a1a1a; background:#1a0a0a; }
.bubble-vergil { color:#e0e0e0; font-family:'Georgia','Times New Roman',serif; font-style:italic; letter-spacing:1.5px; border-color:#555; background:#0d0d0d; }
.bubble-v { color:#d9c2ff; font-family:'Georgia','Times New Roman',serif; font-style:italic; letter-spacing:1px; border-color:#4a3a6e; background:#140d22; }
.msg.user .bubble { background:#c00; border-color:#f00; color:#fff; font-size:16px; font-weight:600; }
.typing-cursor::after { content:'▋'; animation:blink 1s step-end infinite; margin-left:2px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.input { position:fixed; bottom:0; left:0; right:80px; height:52px; display:flex; padding:8px 12px; gap:8px; border-top:1px solid #330000; background:rgba(0,0,0,0.95); z-index:999; }
.input input { flex:1; background:#111; border:1px solid #c00; color:#fff; padding:10px 12px; border-radius:4px; outline:none; font-size:15px; }
.input button { background:#c00; color:#fff; border:none; padding:0 18px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; flex-shrink:0; }
.input button:hover { background:#f00; }
.input input:disabled { opacity:0.5; }

#creator-line { position:fixed; bottom:52px; left:12px; z-index:1000; display:flex; flex-direction:column; gap:1px; pointer-events:none; }
#creator-line span { color:#fff; font-size:11px; font-weight:bold; line-height:1.3; white-space:nowrap; }

.sidebar { position:fixed; right:0; top:72px; bottom:0; width:80px; background:rgba(10,0,0,.95); border-left:2px solid #c00; display:flex; flex-direction:column; align-items:center; padding-top:15px; gap:14px; z-index:500; overflow-y:auto; }
.sidebar::-webkit-scrollbar { display:none; }
.cbtn { width:56px; height:56px; border-radius:50%; border:3px solid #555; background-size:cover; background-position:center; cursor:pointer; opacity:.6; transition:.3s; flex-shrink:0; }
.cbtn.active { border-color:#c00; opacity:1; box-shadow:0 0 14px #c00; }
.cname { color:#fff; font-size:10px; margin-top:2px; text-align:center; margin-bottom:6px; }

#weapon-container { width:68px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:4px; margin-bottom:8px; position:relative; }
#weapon-img { max-width:100%; height:auto; object-fit:contain; border:3px solid #b0b0b0; border-radius:6px; opacity:0; transform:scale(.85) rotate(-2deg); transition:opacity .5s,transform .5s,filter .4s,border-color .4s; pointer-events:auto; cursor:pointer; }
#weapon-img.show { opacity:.95; transform:scale(1) rotate(0deg); }
#weapon-img.v-weapon { border-color:#c876ff !important; filter:drop-shadow(0 0 6px rgba(200,118,255,0.5)); }
#weapon-img.glow-cyan { filter:drop-shadow(0 0 6px rgba(0,229,255,0.7)) brightness(1.1) saturate(1.15); border-color:#00e5ff !important; }
#weapon-img.glow-red { filter:brightness(1.55) saturate(2) sepia(0.25) hue-rotate(-12deg) drop-shadow(0 0 10px #ff1100); border-color:#ff2200 !important; }
#weapon-img.fire-burst { filter:brightness(1.9) saturate(2.2) drop-shadow(0 0 14px #ff5500) drop-shadow(0 0 30px rgba(255,30,0,0.75)) !important; border-color:#ffaa88 !important; }
#weapon-glow { position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:60px; height:18px; opacity:0; transition:opacity .5s; pointer-events:none; }
#weapon-glow.show { opacity:1; }

#fire-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:600; display:none; }

#quota-warning { display:none; position:fixed; bottom:52px; left:0; right:80px; background:rgba(20,0,0,0.95); border-top:2px solid #c00; border-bottom:2px solid #c00; padding:8px 14px; z-index:998; align-items:center; gap:10px; animation:warnSlideUp .4s ease-out; }
@keyframes warnSlideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
#warn-icon { width:22px; height:22px; border-radius:50%; background:#c00; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; color:#fff; flex-shrink:0; }
#warn-text { color:#ff9999; font-size:12px; line-height:1.4; flex:1; }
#warn-close { background:none; border:none; color:#ff6666; font-size:16px; cursor:pointer; }

#scroll-btn { position:fixed; bottom:60px; right:88px; width:36px; height:36px; border-radius:50%; background:rgba(200,0,0,.8); color:#fff; border:none; font-size:18px; cursor:pointer; z-index:998; display:none; align-items:center; justify-content:center; }
#scroll-btn.show { display:flex; }
#mute-btn { position:fixed; bottom:60px; right:130px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.7); color:#fff; border:1px solid #c00; font-size:16px; cursor:pointer; z-index:998; display:flex; align-items:center; justify-content:center; }

#now-playing { position:fixed; bottom:62px; right:172px; font-size:11px; font-weight:bold; z-index:998; pointer-events:auto; cursor:pointer; opacity:0; transition:color .4s; max-width:140px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; animation:neonBreathe 2.4s ease-in-out infinite; }
#now-playing.show { opacity:1; }
#now-playing.v-track { color:#c876ff !important; }
#now-playing.paused { animation-play-state:paused; opacity:0.5; }
@keyframes neonBreathe { 0%,100%{opacity:0.45;text-shadow:0 0 3px currentColor;} 50%{opacity:1;text-shadow:0 0 10px currentColor,0 0 20px currentColor,0 0 35px currentColor;} }

.dt-overlay { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #c00; box-shadow:inset 0 0 80px #c00; } .dt-overlay.show { opacity:1; }
.dt-overlay-blue { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #00aaff; box-shadow:inset 0 0 80px #00aaff; } .dt-overlay-blue.show { opacity:1; }

#combo-counter { position:fixed; top:76px; right:90px; z-index:1000; font-size:13px; font-weight:900; font-style:italic; color:#ffd700; text-shadow:0 0 8px #ffd700,0 0 16px #ff6a00; opacity:0; transition:opacity .3s; pointer-events:none; }
#combo-counter.show { opacity:1; animation:comboPulse .4s ease; }
@keyframes comboPulse { 0%{transform:scale(1.5)} 100%{transform:scale(1)} }

.easter-overlay { position:fixed; inset:0; z-index:300; pointer-events:none; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .3s; }
.easter-overlay.show { opacity:1; }
.easter-text { font-size:48px; font-weight:900; font-style:italic; text-shadow:0 0 20px currentColor,0 0 40px currentColor; }
.coin-rain { position:fixed; inset:0; z-index:301; pointer-events:none; overflow:hidden; }
.coin { position:absolute; top:-40px; width:20px; height:20px; background:radial-gradient(circle,#ffd700 30%,#b8860b 70%,#8b6914 100%); border-radius:50%; animation:coinFall linear forwards; box-shadow:0 0 6px #ffd700; }
@keyframes coinFall { 0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(110vh) rotate(720deg); opacity:0.3;} }

.style-d{color:#7a6a6a} .style-c{color:#ffae42} .style-b{color:#aaff00} .style-a{color:#00e5ff} .style-s{color:#ffd700}
.blood-flash { position:fixed; inset:0; z-index:199; pointer-events:none; background:rgba(200,0,0,.15); opacity:0; } .blood-flash.show { animation:bloodFlash .35s ease-out; }
@keyframes bloodFlash { 0%{opacity:.6} 100%{opacity:0} }
</style>
</head>
<body>

<audio id="aud-nero" preload="metadata" src="nero.mp3" loop></audio>
<audio id="aud-dante" preload="metadata" src="dante.mp3" loop></audio>
<audio id="aud-vergil" preload="metadata" src="vergil.mp3" loop></audio>
<audio id="aud-v" preload="metadata" src="v.mp3" loop></audio>

<div id="intro">
  <img id="intro-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp">
</div>
<img id="mini-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp">
<canvas id="fire-canvas"></canvas>

<div id="orb-wrapper">
  <div id="orb-container"><img src="red_orb.JPG" alt="Red Orb"></div>
  <span id="orb-count">0</span>
</div>

<div id="style-container"><div id="style-grade">D</div><div id="style-sub">Dismal</div></div>

<!-- ★ 玻璃龟裂：SVG有机裂纹 + 多层景深 -->
<div id="glass-crack-overlay">
  <svg viewBox="0 0 200 200" preserveAspectRatio="none">
    <defs>
      <filter id="crackRough"><feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter>
    </defs>
    <!-- 底层：粗裂纹，低透明度 -->
    <g filter="url(#crackRough)" stroke="rgba(255,255,255,0.18)" stroke-width="0.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="100" y1="100" x2="100" y2="6"/><line x1="100" y1="100" x2="194" y2="38"/>
      <line x1="100" y1="100" x2="186" y2="110"/><line x1="100" y1="100" x2="152" y2="184"/>
      <line x1="100" y1="100" x2="72" y2="196"/><line x1="100" y1="100" x2="14" y2="156"/>
      <line x1="100" y1="100" x2="4" y2="86"/><line x1="100" y1="100" x2="26" y2="22"/>
      <line x1="100" y1="100" x2="56" y2="8"/><line x1="100" y1="100" x2="140" y2="14"/>
      <line x1="100" y1="100" x2="184" y2="68"/><line x1="100" y1="100" x2="176" y2="146"/>
      <line x1="100" y1="100" x2="108" y2="190"/><line x1="100" y1="100" x2="40" y2="178"/>
      <line x1="100" y1="100" x2="10" y2="128"/><line x1="100" y1="100" x2="44" y2="56"/>
      <circle cx="100" cy="100" r="28" stroke="rgba(255,255,255,0.10)" stroke-width="0.3"/>
      <circle cx="100" cy="100" r="55" stroke="rgba(255,255,255,0.07)" stroke-width="0.25"/>
      <circle cx="100" cy="100" r="90" stroke="rgba(255,255,255,0.05)" stroke-width="0.2"/>
      <line x1="56" y1="8" x2="140" y2="14"/><line x1="194" y1="38" x2="176" y2="146"/>

async function callAI(r,msg){_log('→ 调用API ['+r+']: '+msg.slice(0,20)+'...','warn');for(var i=0;i<API_ENDPOINTS.length;i++){try{var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},25000);var res=await fetch(API_ENDPOINTS[i],{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},body:JSON.stringify({model:MODEL,messages:[{role:"system",content:prompts[r]},{role:"user",content:msg}],max_tokens:300,temperature:.9}),signal:ctl.signal});clearTimeout(to);var data=await res.json();if(data.error){var em=data.error.message||JSON.stringify(data.error);_log('API错误('+i+'):'+em,'err');if(/token|key|auth|quota|limit|429|invalid/i.test(em))return QUOTA_LINES[r];continue;}return data.choices?data.choices[0].message.content:"（魔界通讯中断…）";}catch(e){_log('请求失败('+i+'):'+(e.name==='AbortError'?'超时':e.message),'err');continue;}}return QUOTA_LINES[r];}
function checkQuota(){fetch(API_ENDPOINTS[0],{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},body:JSON.stringify({model:MODEL,messages:[{role:"user",content:"hi"}],max_tokens:1})}).then(function(r){return r.json();}).then(function(d){if(d.error&&/token|key|auth|quota|limit|429/i.test(JSON.stringify(d.error))){document.getElementById('quota-warning').style.display='flex';document.getElementById('ui').placeholder="⚠️ AI额度已耗尽";}}).catch(function(){});}

//================================================== 红魂
var redOrbs=0,maxOrbs=999999,totalStylish=0;
var orbCountEl=document.getElementById('orb-count');
var orbContainer=document.getElementById('orb-container');
function addOrbs(amount,startX,startY){
  if(amount<=0)return;
  var old=redOrbs; redOrbs=Math.min(maxOrbs,redOrbs+amount);
  orbCountEl.style.transform='scale(1.5)'; setTimeout(function(){orbCountEl.style.transform='';},400);
  animateOrbCount(old,redOrbs,600);
  if(startX!==undefined&&startY!==undefined) spawnOrbParticle(startX,startY);
}
function animateOrbCount(from,to,duration){
  var start=performance.now();
  function step(now){var prog=Math.min(1,(now-start)/duration);var cur=Math.floor(from+(to-from)*prog);orbCountEl.textContent=cur.toLocaleString();if(prog<1)requestAnimationFrame(step);else orbCountEl.textContent=to.toLocaleString();}
  requestAnimationFrame(step);
}
function spawnOrbParticle(sx,sy){
  var p=document.createElement('div');p.className='orb-fly-particle';
  p.innerHTML='<img src="red_orb.JPG" style="width:100%;height:100%;object-fit:cover;display:block;">';
  p.style.left=sx-10+'px';p.style.top=sy-10+'px';document.body.appendChild(p);
  var iconRect=orbContainer.getBoundingClientRect();
  var ex=iconRect.left+iconRect.width/2-10,ey=iconRect.top+iconRect.height/2-10;
  var dx=ex-sx,dy=ey-sy,dur=Math.min(900,Math.max(450,Math.sqrt(dx*dx+dy*dy)*0.7));
  var startTime=performance.now();
  function fly(now){var prog=Math.min(1,(now-startTime)/dur);var ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;p.style.left=(sx+dx*ease)+'px';p.style.top=(sy+dy*ease)+'px';p.style.opacity=0.4+ease*0.6;p.style.transform='scale('+(1.2-ease*0.4)+')';if(prog<1)requestAnimationFrame(fly);else p.remove();}
  requestAnimationFrame(fly);
}

var STYLE_TABLE=[{g:"D",sub:"Dismal"},{g:"C",sub:"Crazy"},{g:"B",sub:"Badass"},{g:"A",sub:"Apocalyptic"},{g:"S",sub:"Savage!"}];
var curStyleIdx=-1,maxStyleIdx=0,styleTimer=null;
var styleContainer=document.getElementById('style-container'),styleGrade=document.getElementById('style-grade'),styleSub=document.getElementById('style-sub');
function setStyle(idx){
  if(idx<0)idx=0;if(idx>4)idx=4;
  if(idx===curStyleIdx)return;
  curStyleIdx=idx;var s=STYLE_TABLE[idx];
  styleGrade.textContent=s.g;styleGrade.style.color=ROLE_COLORS[cur]||'#888';
  styleSub.textContent=s.sub;styleSub.style.color=ROLE_COLORS[cur]||'#888';
  styleGrade.classList.add('pop');styleSub.classList.add('pop');
  setTimeout(function(){styleGrade.classList.remove('pop');styleSub.classList.remove('pop');},400);
  if(idx>=1){styleContainer.classList.add('show');}else{styleContainer.classList.remove('show');}
  if(idx>maxStyleIdx)maxStyleIdx=idx;
  clearTimeout(styleTimer);
  if(idx>=1){styleTimer=setTimeout(function(){degradeStyle();},8000);}
}
function degradeStyle(){if(curStyleIdx>0){setStyle(curStyleIdx-1);}else{styleContainer.classList.remove('show');curStyleIdx=-1;}}
function bumpStyle(){if(curStyleIdx<0)setStyle(1);else if(curStyleIdx<4)setStyle(curStyleIdx+1);else{clearTimeout(styleTimer);styleTimer=setTimeout(function(){degradeStyle();},8000);}}

var audios={nero:document.getElementById('aud-nero'),dante:document.getElementById('aud-dante'),vergil:document.getElementById('aud-vergil'),v:document.getElementById('aud-v')};
var audioUnlocked=false,isMuted=false,cur="nero";
var np=document.getElementById('now-playing'),muteBtn=document.getElementById('mute-btn');
function setVolumes(){Object.keys(audios).forEach(function(k){audios[k].volume=isMuted?0:0.3;});}
function tryPlay(role){
  Object.keys(audios).forEach(function(k){if(k!==role){audios[k].pause();try{audios[k].currentTime=0;}catch(e){}}});
  var t=audios[role];t.volume=0;try{t.currentTime=0;}catch(e){}
  var p=t.play();
  function onSuccess(){audioUnlocked=true;setVolumes();updateNowPlaying(role);addOrbs(100);}
  function onFail(){if(confirm('⚠ '+role+'.mp3 播放失败。\n是否重试？'))tryPlay(role);}
  if(p&&p.then){p.then(onSuccess).catch(onFail);}else{onSuccess();}
}
function playRole(r){
  Object.keys(audios).forEach(function(k){if(k!==r){audios[k].pause();try{audios[k].currentTime=0;}catch(e){}}});
  updateNowPlaying(r);
  var t=audios[r];t.volume=isMuted?0:0.3;
  try{t.currentTime=0;}catch(e){}
  var p=t.play();
  if(p&&p.then){p.then(function(){setTimeout(function(){if(t.currentTime>0){audioUnlocked=true;}else if(audioUnlocked){if(confirm('⚠ '+r+'.mp3 可能未播放。\n是否重试？'))tryPlay(r);}},800);}).catch(function(){if(audioUnlocked){if(confirm('⚠ '+r+'.mp3 播放失败。\n是否重试？'))tryPlay(r);}});}
}
function toggleMute(){isMuted=!isMuted;setVolumes();muteBtn.textContent=isMuted?'🔇':'🔊';if(!isMuted&&audioUnlocked)playRole(cur);}
function toggleTrack(){if(!audioUnlocked)return;var t=audios[cur];if(t.paused){t.play();np.classList.remove('paused');}else{t.pause();np.classList.add('paused');}}

var comboCount=0,comboTimer=null;
function bumpCombo(){comboCount++;var cc=document.getElementById('combo-counter');if(comboCount>=2){cc.textContent='🔥 COMBO x'+comboCount;cc.classList.remove('show');void cc.offsetWidth;cc.classList.add('show');}clearTimeout(comboTimer);comboTimer=setTimeout(function(){comboCount=0;cc.classList.remove('show');},30000);}

// 彩蛋
var EASTER_EGGS={'devil trigger':{text:'DEVIL TRIGGER!!!',color:'#ff2200',action:'dt'},'jackpot':{text:'JACKPOT!',color:'#ffd700',action:'coins'},'yahoo':{text:'YAHOO!',color:'#4fc3f7',action:'flash'},'motivation':{text:'MOTIVATION...',color:'#c876ff',action:'flash'},'bury the light':{text:'BURY THE LIGHT',color:'#80c0ff',action:'dt-blue'},'斯巴达':{text:'I AM SPARDA!',color:'#ff2200',action:'flash'}};
function checkEasterEgg(msg){var l=msg.toLowerCase();for(var k in EASTER_EGGS){if(l.indexOf(k)!==-1){triggerEasterEgg(EASTER_EGGS[k]);return true;}}return false;}
function triggerEasterEgg(egg){_log('彩蛋触发:'+egg.text,'ok');var o=document.getElementById('easter-overlay'),t=document.getElementById('easter-text');t.textContent=egg.text;t.style.color=egg.color;o.classList.add('show');setTimeout(function(){o.classList.remove('show');},1500);if(egg.action==='coins')spawnCoins();if(egg.action==='dt'){var r=document.getElementById('dt-red');r.classList.add('show');setTimeout(function(){r.classList.remove('show');},800);}if(egg.action==='dt-blue'){var b=document.getElementById('dt-blue');b.classList.add('show');setTimeout(function(){b.classList.remove('show');},800);}if(egg.action==='flash')bloodFlash();}
function spawnCoins(){var c=document.getElementById('coin-rain');c.innerHTML='';for(var i=0;i<30;i++){var coin=document.createElement('div');coin.className='coin';coin.style.left=Math.random()*100+'%';coin.style.animationDuration=(1.5+Math.random()*2)+'s';coin.style.animationDelay=(Math.random()*0.5)+'s';c.appendChild(coin);}setTimeout(function(){c.innerHTML='';},4000);}

// 聊天
var avs={nero:"https://i.postimg.cc/2yXv0dfR/ab0e3d8b0d10b13ee56e113eadd1e3e83700043f2f7bba201a49bc3e30884537-0.jpg",dante:"https://i.postimg.cc/MHrR908Q/1771934129984.jpg",vergil:"https://i.postimg.cc/x8FH6GSm/1771934121143.jpg",v:"https://i.postimg.cc/gkxjp9Pw/b19ab9897647c907a11733dfd0f6dfc3.jpg"};
var dtLines={nero:"Fuck you!",dante:"Jackpot!",vergil:"This is power!",v:"Motivation..."};
var bubbleClass={nero:"bubble-nero",dante:"bubble-dante",vergil:"bubble-vergil",v:"bubble-v"};
var nameClass={nero:"name-nero",dante:"name-dante",vergil:"name-vergil",v:"name-v"};
function scrollToBottom(){chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});}
function checkScrollBtn(){chat.scrollTop<chat.scrollHeight-chat.clientHeight-60?scrollBtn.classList.add('show'):scrollBtn.classList.remove('show');}
chat.addEventListener('scroll',checkScrollBtn);
function typeText(el,text,speed,onDone){el.textContent="";var i=0;(function n(){if(i<text.length){el.textContent+=text[i++];chat.scrollTop=chat.scrollHeight;setTimeout(n,speed);}else{chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});if(onDone)onDone();}})();}
function say(r,text,isUser){var d=document.createElement('div');d.className='msg'+(isUser?' user':'');if(isUser)d.innerHTML='<img class="av" src="https://placehold.co/100x100/333/fff?text=Me"><div><div class="name">You</div><div class="bubble"></div></div>';else d.innerHTML='<img class="av" src="'+avs[r]+'"><div><div class="name '+nameClass[r]+'">'+r.charAt(0).toUpperCase()+r.slice(1)+'</div><div class="bubble '+bubbleClass[r]+'"></div></div>';chat.appendChild(d);chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});if(!isUser)typeText(d.querySelector('.bubble'),text,28);else d.querySelector('.bubble').textContent=text;}

async function send(){
  var ui=document.getElementById('ui'),t=ui.value.trim();if(!t)return;
  if(checkEasterEgg(t)){ui.value='';addOrbs(500);bumpStyle();totalStylish+=500;return;}
  say('you',t,true);ui.value='';bloodFlash();bumpCombo();msgCount++;
  addOrbs(10);addOrbs(Math.min(comboCount*20,200));bumpStyle();totalStylish+=10+comboCount*5;
  if(msgCount>=15&&!resultAutoShown){resultAutoShown=true;setTimeout(showResult,800);}
  var temp=document.createElement('div');temp.className='msg';
  temp.innerHTML='<img class="av" src="'+avs[cur]+'"><div><div class="name '+nameClass[cur]+'">'+cur+'</div><div class="bubble '+bubbleClass[cur]+' typing-cursor" style="color:#888;font-style:normal">'+WAITING_TEXT[cur]+'</div></div>';
  chat.appendChild(temp);chat.scrollTo({top:chat.scrollHeight+200,behavior:'smooth'});
  var reply=await callAI(cur,t);
  if(reply===QUOTA_LINES[cur]){ui.disabled=true;ui.placeholder="⚠️ AI额度已耗尽";addOrbs(-50);}
  temp.querySelector('.bubble').classList.remove('typing-cursor');temp.querySelector('.bubble').textContent="";temp.querySelector('.bubble').style.color="";temp.querySelector('.bubble').style.fontStyle="";
  typeText(temp.querySelector('.bubble'),reply,28);
}

function sw(c){
  if(cur===c)return;
  var isReturn=hasVisited(c);cur=c;
  document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('active');});
  document.getElementById('b-'+c).classList.add('active');
  chat.innerHTML='';
  if(isReturn)say(c,pickReturnLine(c),false);else say(c,getRandomIntro(c),false);
  markVisited(c);scrollBtn.classList.remove('show');
  updateTitleColor(c);updateWeapon(c);addOrbs(30);
  if(audioUnlocked)playRole(c);
}

var pressTimer=null,pressStart=0;
function bindDT(id,r){var b=document.getElementById(id);b.addEventListener('touchstart',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(r);},1500);});b.addEventListener('touchend',function(e){e.preventDefault();clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(r);});b.addEventListener('mousedown',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(r);},1500);});b.addEventListener('mouseup',function(){clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(cur);});b.addEventListener('mouseleave',function(){clearTimeout(pressTimer);});}
function triggerDT(r){var o=(r==='dante')?document.getElementById('dt-red'):document.getElementById('dt-blue');o.classList.add('show');setTimeout(function(){o.classList.remove('show');},800);say(r,dtLines[r],false);addOrbs(200);bumpStyle();totalStylish+=200;}
bindDT('b-nero','nero');bindDT('b-dante','dante');bindDT('b-vergil','vergil');bindDT('b-v','v');

function bloodFlash(){var f=document.createElement('div');f.className='blood-flash show';document.body.appendChild(f);setTimeout(function(){f.remove();},400);}

_log('系统初始化...','ok');_log('当前角色:'+cur,'ok');
_log('功能:图1布局+SVG龟裂+角色×评级台词精确匹配','ok');
</script>
