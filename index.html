<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL MAY CRY 5 — AI CHAT</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000; color:#fff;
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  overflow:hidden; height:100vh; width:100vw;
  -webkit-user-drag:none; user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

#log-panel {
  position:fixed; bottom:0; left:0; right:0; max-height:35vh;
  background:rgba(0,20,0,0.95); border-top:2px solid #0f0; z-index:9999;
  overflow-y:auto; display:none; padding:8px 10px;
  font-family:'Courier New',monospace; font-size:11px; color:#0f0;
}
#log-panel.show { display:block; }
.log-line { margin:1px 0; }
.log-err { color:#f55; } .log-ok { color:#5f5; } .log-warn { color:#ff5; }

#intro {
  position:fixed; inset:0; background:#000; z-index:9998;
  display:flex; justify-content:center; align-items:center; transition:opacity 0.6s ease;
}
#intro-logo { position:absolute; width:240px; height:auto; opacity:0; filter:blur(12px); cursor:pointer; }

#app { display:none; height:100vh; width:100vw; flex-direction:column; position:relative; }
#mini-logo { position:fixed; top:8px; left:10px; height:32px; z-index:1000; display:none; cursor:pointer; }

.topbar {
  height:72px; background:rgba(0,0,0,0.9); border-bottom:1px solid #330000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  flex-shrink:0; gap:4px; padding:4px 0;
}
.topbar-title {
  font-size:15px; font-weight:900; font-style:italic; letter-spacing:3px;
  text-shadow:0 0 8px currentColor,0 0 20px currentColor;
  transition:color .4s,text-shadow .4s; cursor:default; line-height:1;
}
#lyric {
  font-size:12px; font-weight:700; font-style:italic; letter-spacing:1.5px;
  opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:90vw; text-align:center;
  text-shadow:0 0 6px currentColor,0 0 14px currentColor,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
  -webkit-text-stroke:.4px currentColor; transition:color .4s,text-shadow .4s; line-height:1.2; margin-top:2px;
}

.chat {
  flex:1; overflow-y:auto; padding:10px 90px 70px 15px;
  display:flex; flex-direction:column; gap:14px;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
.chat::-webkit-scrollbar { width:5px; }
.chat::-webkit-scrollbar-thumb { background:#c00; border-radius:3px; }

.msg { display:flex; gap:10px; max-width:85%; animation:msgIn .25s ease-out; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.av { width:42px; height:42px; border-radius:50%; border:2px solid #c00; object-fit:cover; flex-shrink:0; }

.name-nero { color:#4fc3f7 !important; }
.name-dante { color:#ff5252 !important; }
.name-vergil { color:#80c0ff !important; }
.name-v { color:#c876ff !important; }

.bubble { background:#151515; border:1px solid #333; padding:10px 14px; border-radius:10px; line-height:1.65; font-size:16px; word-break:break-word; }
.bubble-nero { color:#4fc3f7; font-family:'Nunito','Segoe UI','Microsoft YaHei',sans-serif; font-weight:700; border-color:#1a4a6e; background:#0a1622; }
.bubble-dante { color:#ff5252; font-family:'Comic Sans MS','Segoe UI',sans-serif; font-style:italic; font-weight:600; border-color:#5a1a1a; background:#1a0a0a; }
.bubble-vergil { color:#e0e0e0; font-family:'Georgia','Times New Roman','Microsoft YaHei',serif; font-style:italic; letter-spacing:1.5px; border-color:#555; background:#0d0d0d; }
.bubble-v { color:#d9c2ff; font-family:'Georgia','Times New Roman','Microsoft YaHei',serif; font-style:italic; letter-spacing:1px; border-color:#4a3a6e; background:#140d22; }
.msg.user .bubble { background:#c00; border-color:#f00; color:#fff; font-size:16px; font-weight:600; }

.input {
  position:fixed; bottom:0; left:0; right:80px; height:52px;
  display:flex; padding:8px 12px; gap:8px;
  border-top:1px solid #330000; background:rgba(0,0,0,0.95); z-index:999;
}
.input input { flex:1; background:#111; border:1px solid #c00; color:#fff; padding:10px 12px; border-radius:4px; outline:none; font-size:15px; }
.input button { background:#c00; color:#fff; border:none; padding:0 18px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; flex-shrink:0; }
.input button:hover { background:#f00; }

#creator-line {
  position:fixed; bottom:52px; left:12px; z-index:1000;
  display:flex; flex-direction:column; gap:1px; pointer-events:none; user-select:none;
}
#creator-line .c-name, #creator-line .c-qq { color:#fff; font-size:11px; font-weight:bold; line-height:1.3; white-space:nowrap; }

.sidebar {
  position:fixed; right:0; top:72px; bottom:0; width:80px;
  background:rgba(10,0,0,.95); border-left:2px solid #c00;
  display:flex; flex-direction:column; align-items:center;
  padding-top:15px; gap:14px; z-index:500; overflow-y:auto;
}
.sidebar::-webkit-scrollbar { display:none; }

.cbtn { width:56px; height:56px; border-radius:50%; border:3px solid #555; background-size:cover; background-position:center; cursor:pointer; opacity:.6; transition:.3s; flex-shrink:0; }
.cbtn.active { border-color:#c00; opacity:1; box-shadow:0 0 14px #c00; }
.cname { color:#fff; font-size:10px; margin-top:2px; text-align:center; margin-bottom:6px; }

#weapon-container {
  width:68px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin-top:4px; margin-bottom:8px; position:relative;
}
#weapon-img {
  max-width:100%; height:auto; object-fit:contain;
  border:3px solid #b0b0b0; border-radius:6px; opacity:0;
  transform:scale(.85) rotate(-2deg);
  transition:opacity .5s,transform .5s,filter .4s,border-color .4s;
  pointer-events:auto; cursor:pointer;
  -webkit-user-drag:none; user-select:none; touch-action:manipulation;
}
#weapon-img.show { opacity:.95; transform:scale(1) rotate(0deg); }
#weapon-img.v-weapon {
  border-color:#c876ff !important;
  filter:drop-shadow(0 0 6px rgba(200,118,255,0.5)) drop-shadow(0 0 14px rgba(200,118,255,0.25));
}
#weapon-img.glow-cyan {
  filter:drop-shadow(0 0 6px rgba(0,229,255,0.7)) drop-shadow(0 0 14px rgba(0,229,255,0.4)) drop-shadow(0 0 22px rgba(0,200,255,0.2)) brightness(1.1) saturate(1.15);
  border-color:#00e5ff !important;
}
#weapon-img.glow-red {
  filter:brightness(1.55) saturate(2) sepia(0.25) hue-rotate(-12deg) drop-shadow(0 0 4px #ff3300) drop-shadow(0 0 10px #ff1100) drop-shadow(0 0 22px rgba(255,20,0,0.65));
  border-color:#ff2200 !important;
}
#weapon-img.fire-burst {
  filter:brightness(1.9) saturate(2.2) sepia(0.1) hue-rotate(-8deg) drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #ff5500) drop-shadow(0 0 30px rgba(255,30,0,0.75)) !important;
  border-color:#ffaa88 !important;
}
#weapon-glow { position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:60px; height:18px; opacity:0; transition:opacity .5s; pointer-events:none; }
#weapon-glow.show { opacity:1; }

#fire-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:600; display:none; }

#quota-warning {
  display:none; position:fixed; bottom:52px; left:0; right:80px;
  background:rgba(20,0,0,0.95); border-top:2px solid #c00; border-bottom:2px solid #c00;
  padding:8px 14px; z-index:998; align-items:center; gap:10px; animation:warnSlideUp .4s ease-out;
}
@keyframes warnSlideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
#warn-icon { width:22px; height:22px; border-radius:50%; background:#c00; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; color:#fff; }
#warn-text { color:#ff9999; font-size:12px; line-height:1.4; flex:1; }
#warn-close { background:none; border:none; color:#ff6666; font-size:16px; cursor:pointer; padding:0 4px; }
#warn-close:hover { color:#fff; }

#scroll-btn { position:fixed; bottom:60px; right:88px; width:36px; height:36px; border-radius:50%; background:rgba(200,0,0,0.8); color:#fff; border:none; font-size:18px; cursor:pointer; z-index:998; display:none; align-items:center; justify-content:center; }
#scroll-btn.show { display:flex; }
#mute-btn { position:fixed; bottom:60px; right:130px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.7); color:#fff; border:1px solid #c00; font-size:16px; cursor:pointer; z-index:998; display:flex; align-items:center; justify-content:center; }
#mute-btn:hover { background:rgba(200,0,0,0.5); }

#now-playing {
  position:fixed; bottom:62px; right:172px; color:#c00; font-size:11px; font-weight:bold;
  z-index:998; pointer-events:none;
  opacity:0; transition:opacity 0.3s, color 0.4s;
  max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  animation: neonBreathe 2.4s ease-in-out infinite;
}
#now-playing.show { opacity:1; }
#now-playing.v-track { color:#c876ff !important; text-shadow:0 0 8px #c876ff,0 0 16px rgba(200,118,255,0.4); }

@keyframes neonBreathe {
  0%, 100% { opacity:0.5; text-shadow:0 0 4px currentColor; }
  50%      { opacity:1;   text-shadow:0 0 12px currentColor,0 0 22px currentColor,0 0 36px currentColor; }
}

.dt-overlay { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #c00; box-shadow:inset 0 0 80px #c00; } .dt-overlay.show { opacity:1; }
.dt-overlay-blue { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #00aaff; box-shadow:inset 0 0 80px #00aaff; } .dt-overlay-blue.show { opacity:1; }

.style-pop { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) skewX(-10deg); font-family:'Cinzel Decorative',serif; font-weight:900; z-index:500; pointer-events:none; animation:stylePop 1s ease-out forwards; text-shadow:0 0 12px currentColor,0 0 24px currentColor; }
@keyframes stylePop { 0%{opacity:0;transform:translate(-50%,-50%) skewX(-10deg) scale(.4)} 20%{opacity:1;transform:translate(-50%,-50%) skewX(-10deg) scale(1.25)} 35%{transform:translate(-50%,-50%) skewX(-10deg) scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translate(-50%,-60%) skewX(-10deg) scale(1)} }
.style-sub { display:block; font-size:16px; font-weight:700; letter-spacing:2px; margin-top:4px; font-family:'Segoe UI',sans-serif; transform:skewX(10deg); text-align:center; }
.style-d{color:#7a6a6a} .style-c{color:#ffae42} .style-b{color:#aaff00} .style-a{color:#00e5ff} .style-s{color:#ffd700} .style-ss{color:#ff6a00} .style-sss{color:#ff2d95}
.blood-flash { position:fixed; inset:0; z-index:199; pointer-events:none; background:rgba(200,0,0,.15); opacity:0; } .blood-flash.show { animation:bloodFlash .35s ease-out; }
@keyframes bloodFlash { 0%{opacity:.6} 100%{opacity:0} }
</style>
</head>
<body>

<audio id="aud-nero" preload="auto" src="nero.mp3"></audio>
<audio id="aud-dante" preload="auto" src="dante.mp3"></audio>
<audio id="aud-vergil" preload="auto" src="vergil.mp3"></audio>
<audio id="aud-v" preload="auto" src="v.mp3"></audio>

<div id="intro">
  <img id="intro-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp">
</div>
<img id="mini-logo" src="https://i.postimg.cc/TwdDGNdY/e6e5add26d2fdd9558b8f92097d3cb44b3baf321aead2097e78133d06b2ac778-0.webp">
<canvas id="fire-canvas"></canvas>

<div id="creator-line">
  <span class="c-name">制作者：一庭霜月满襟寒（bilibili）</span>
  <span class="c-qq">网站制作者QQ：1127421253，欢迎提出建议</span>
</div>

<div id="quota-warning">
  <div id="warn-icon">!</div>
  <div id="warn-text">本站使用免费 API 额度驱动对话，目前已耗尽，你可以继续体验界面交互功能，等候网站制作者自行恢复</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-title" id="top-title">DEVIL MAY CRY 5 — AI CHAT</div>
    <div id="lyric"></div>
  </div>

    <input id="ui" placeholder="输入你的话语..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
  <div class="sidebar">
    <div class="cbtn active" id="b-nero" style="background-image:url('https://i.postimg.cc/2yXv0dfR/ab0e3d8b0d10b13ee56e113eadd1e3e83700043f2f7bba201a49bc3e30884537-0.jpg')" onclick="sw('nero')"></div><div class="cname">Nero</div>
    <div class="cbtn" id="b-dante" style="background-image:url('https://i.postimg.cc/MHrR908Q/1771934129984.jpg')" onclick="sw('dante')"></div><div class="cname">Dante</div>
    <div class="cbtn" id="b-vergil" style="background-image:url('https://i.postimg.cc/x8FH6GSm/1771934121143.jpg')" onclick="sw('vergil')"></div><div class="cname">Vergil</div>
    <div class="cbtn" id="b-v" style="background-image:url('https://i.postimg.cc/gkxjp9Pw/b19ab9897647c907a11733dfd0f6dfc3.jpg')" onclick="sw('v')"></div><div class="cname">V</div>
    <div id="weapon-container">
      <div id="weapon-glow"></div>
      <img id="weapon-img" src="" alt="weapon">
    </div>
  </div>
</div>

<div class="dt-overlay" id="dt-red"></div>
<div class="dt-overlay-blue" id="dt-blue"></div>
<div id="log-panel"></div>

<script>
window.addEventListener('error', function(e){ _log('全局错误:'+e.message,'err'); });

function _log(msg,type){
  var p=document.getElementById('log-panel'); if(!p)return;
  var d=document.createElement('div'); d.className='log-line'+(type?' log-'+type:'');
  d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  p.appendChild(d); while(p.children.length>200)p.removeChild(p.firstChild);
  p.scrollTop=p.scrollHeight;
}

/* ===== Logo 单击百科 / 双击日志 ===== */
var BAIKE_URL = 'https://baike.baidu.com/item/%E9%AC%BC%E6%B3%A35';
var logoClickTimer = null;

function bindLogoTap(el){
  el.addEventListener('click', function(e){
    logoClickTimer = setTimeout(function(){
      window.open(BAIKE_URL, '_blank');
    }, 350);
  });
  el.addEventListener('dblclick', function(e){
    e.preventDefault();
    clearTimeout(logoClickTimer);
    var panel = document.getElementById('log-panel');
    panel.classList.toggle('show');
    if(panel.classList.contains('show')){
      panel.scrollTop = panel.scrollHeight;
    }
  });
}
bindLogoTap(document.getElementById('mini-logo'));
bindLogoTap(document.getElementById('intro-logo'));
document.getElementById('log-panel').addEventListener('click', function(e){
  e.stopPropagation();
});

// ===== 角色颜色/歌词/曲目配置 =====
var TITLE_COLORS = { nero:"#ffffff", dante:"#ff5252", vergil:"#80c0ff", v:"#c876ff" };
var LYRICS = {
  nero:"Bang, bang, bang — Pull my Devil Trigger",
  dante:"You cannot kill me! I am Subhuman!",
  vergil:"I am the storm that is approaching",
  v:"Savior Bloodstained Hellfire Shadow"
};
var TRACK_NAMES = {
  nero:"♪ Nero — Devil Trigger",
  dante:"♪ Dante — Subhuman",
  vergil:"♪ Vergil — Bury the Light",
  v:"♪ V — Crimson Cloud"
};
var TRACK_COLORS = { nero:"#ffffff", dante:"#ff5252", vergil:"#80c0ff", v:"#c876ff" };

function updateTitleColor(r){
  document.getElementById('top-title').style.color = TITLE_COLORS[r];
  var l = document.getElementById('lyric');
  l.style.color = TITLE_COLORS[r];
  l.textContent = LYRICS[r];
}

function updateNowPlaying(r){
  var np = document.getElementById('now-playing');
  np.textContent = TRACK_NAMES[r];
  np.style.color = TRACK_COLORS[r];
  np.classList.remove('v-track');
  if(r === 'v') np.classList.add('v-track');
  np.classList.add('show');
}

// ===== 武器配置 =====
var WEAPON_IMGS = {
  vergil:"yamato.png",
  nero:"https://i.postimg.cc/BvGsMmcz/aebf56b3276a71fdea06b9e5abb942d88293704cafd5ea7544f3aa7f85e96a1d-0.png",
  dante:"https://i.postimg.cc/s2RywT90/d7bb84ad07891cb9c5fa4bdaacf4a962c2964e974fa890e552838041fa997203-0.jpg",
  v:"cane_final.png"
};
var WEAPON_BORDERS = { nero:"#4fc3f7", dante:"#ff5252", vergil:"#b0b0b0", v:"#c876ff" };
var WEAPON_GLOWS = {
  nero:"radial-gradient(ellipse,rgba(79,195,247,.3) 0%,transparent 70%)",
  dante:"radial-gradient(ellipse,rgba(255,82,82,.3) 0%,transparent 70%)",
  vergil:"radial-gradient(ellipse,rgba(128,192,255,.3) 0%,transparent 70%)",
  v:"radial-gradient(ellipse,rgba(200,118,255,.3) 0%,transparent 70%)"
};

var glowTimer=null, weaponAnimating=false;
function updateWeapon(r){
  var img=document.getElementById('weapon-img'), glow=document.getElementById('weapon-glow');
  img.classList.remove('show','glow-cyan','glow-red','fire-burst','v-weapon');
  glow.classList.remove('show');
  if(glowTimer){clearTimeout(glowTimer);glowTimer=null;}
  setTimeout(function(){
    img.src=WEAPON_IMGS[r];
    img.style.borderColor=WEAPON_BORDERS[r];
    glow.style.background=WEAPON_GLOWS[r];
    if(r==='v') img.classList.add('v-weapon');
    img.onload=function(){
      img.classList.add('show');
      glow.classList.add('show');
      if(r==='nero') img.classList.add('glow-cyan');
    };
    img.onerror=function(){
      _log('武器加载失败:'+r,'err');
      img.alt='[加载失败]';
      img.classList.add('show');
    };
  },250);
}

// ===== 火焰系统 =====
var fireCanvas=document.getElementById('fire-canvas'), fireCtx=fireCanvas.getContext('2d');
function resizeCanvas(){fireCanvas.width=window.innerWidth;fireCanvas.height=window.innerHeight;}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

function BladeFlame(sx,sy,sw,sh){this.p=Math.random();this.x=sx+this.p*sw;this.y=sy+(0.15+Math.random()*0.7)*sh;this.len=30+Math.random()*55;this.width=1.8+Math.random()*3.2;this.angle=-Math.PI*(125+Math.random()*45)/180;this.speed=3.5+Math.random()*4.5;this.life=1;this.decay=0.016+Math.random()*0.014;this.hx=this.x;this.hy=this.y;}
BladeFlame.prototype.update=function(){this.hx+=Math.cos(this.angle)*this.speed;this.hy+=Math.sin(this.angle)*this.speed;this.life-=this.decay;};
BladeFlame.prototype.draw=function(c){if(this.life<=0)return;var a=this.life,tX=this.hx-Math.cos(this.angle)*this.len,tY=this.hy-Math.sin(this.angle)*this.len;c.beginPath();c.moveTo(this.hx,this.hy);c.lineTo(tX,tY);c.strokeStyle='rgba(255,'+(20+a*160|0)+',0,'+(a*0.55)+')';c.lineWidth=this.width*2.6;c.lineCap='round';c.stroke();c.beginPath();c.moveTo(this.hx,this.hy);c.lineTo(tX+Math.cos(this.angle)*this.len*0.28,tY+Math.sin(this.angle)*this.len*0.28);c.strokeStyle='rgba(255,220,'+(40+a*40|0)+','+(a*0.9)+')';c.lineWidth=this.width*0.95;c.stroke();c.beginPath();c.arc(this.hx,this.hy,this.width*0.7,0,Math.PI*2);c.fillStyle='rgba(255,255,255,'+(a*0.97)+')';c.fill();};

function TrailLine(tx,ty){this.x=tx;this.y=ty;this.angle=-Math.PI*(125+Math.random()*28)/180;this.len=70+Math.random()*100;this.width=0.6+Math.random()*2.2;this.speed=7+Math.random()*8;this.life=1;this.decay=0.012+Math.random()*0.01;this.hx=this.x;this.hy=this.y;}
TrailLine.prototype.update=function(){this.hx+=Math.cos(this.angle)*this.speed;this.hy+=Math.sin(this.angle)*this.speed;this.life-=this.decay;};
TrailLine.prototype.draw=function(c){if(this.life<=0)return;var a=this.life,tX=this.hx-Math.cos(this.angle)*this.len,tY=this.hy-Math.sin(this.angle)*this.len;var g=c.createLinearGradient(this.hx,this.hy,tX,tY);g.addColorStop(0,'rgba(255,210,40,'+(a*0.85)+')');g.addColorStop(0.28,'rgba(255,60,8,'+(a*0.5)+')');g.addColorStop(1,'rgba(100,0,0,0)');c.beginPath();c.moveTo(this.hx,this.hy);c.lineTo(tX,tY);c.strokeStyle=g;c.lineWidth=this.width*3.2;c.lineCap='round';c.stroke();var g2=c.createLinearGradient(this.hx,this.hy,tX,tY);g2.addColorStop(0,'rgba(255,255,210,'+(a*0.97)+')');g2.addColorStop(0.18,'rgba(255,170,20,'+(a*0.6)+')');g2.addColorStop(1,'rgba(180,5,0,0)');c.beginPath();c.moveTo(this.hx,this.hy);c.lineTo(tX+Math.cos(this.angle)*this.len*0.25,tY+Math.sin(this.angle)*this.len*0.25);c.strokeStyle=g2;c.lineWidth=this.width*0.75;c.stroke();};

function Spark(tx,ty){this.x=tx+(Math.random()-0.5)*14;this.y=ty+(Math.random()-0.5)*12;var ang=-Math.PI*0.5+(Math.random()-0.5)*3.2,sp=3+Math.random()*8;this.vx=Math.cos(ang)*sp;this.vy=Math.sin(ang)*sp-1.5;this.life=1;this.decay=0.008+Math.random()*0.014;this.size=0.3+Math.random()*2;}
Spark.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.035;this.vx*=0.94;this.life-=this.decay;};
Spark.prototype.draw=function(c){if(this.life<=0)return;c.beginPath();c.arc(this.x,this.y,this.size,0,Math.PI*2);c.fillStyle='rgba(255,'+(150+Math.random()*105|0)+',35,'+this.life+')';c.fill();};

  fireCanvas.style.display='block';var st=performance.now(),D=1500;

    var pr=(now-st)/D;
    fireCtx.globalCompositeOperation='destination-out';
    fireCtx.fillStyle='rgba(0,0,0,0.28)';fireCtx.fillRect(0,0,fireCanvas.width,fireCanvas.height);

}
