<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEVIL MAY CRY 5 — AI CHAT</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#000; color:#fff;
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  overflow:hidden; height:100vh; width:100vw;
}

/* ===== 日志面板 ===== */
#log-panel {
  position:fixed; bottom:0; left:0; right:0;
  max-height:35vh; background:rgba(0,20,0,0.95);
  border-top:2px solid #0f0; z-index:9999; overflow-y:auto; display:none;
  padding:8px 10px; font-family:'Courier New',monospace; font-size:11px; color:#0f0;
}
#log-panel.show { display:block; }
.log-line { margin:1px 0; }
.log-err { color:#f55; } .log-ok { color:#5f5; } .log-warn { color:#ff5; }

/* ===== 开场 ===== */
#intro {
  position:fixed; inset:0; background:#000; z-index:9998;
  display:flex; justify-content:center; align-items:center; transition:opacity 0.6s ease;
}
#intro-logo { position:absolute; width:240px; height:auto; opacity:0; filter:blur(12px); cursor:pointer; }

/* ===== 主界面 ===== */
#app { display:none; height:100vh; width:100vw; flex-direction:column; position:relative; }
#mini-logo { position:fixed; top:8px; left:10px; height:32px; z-index:1000; display:none; cursor:pointer; }

/* ===== 顶栏 ===== */
.topbar {
  height:72px; background:rgba(0,0,0,0.9); border-bottom:1px solid #330000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  flex-shrink:0; gap:4px; padding:4px 0;
}
.topbar-title {
  font-size:15px; font-weight:900; font-style:italic; letter-spacing:3px;
  text-shadow:0 0 8px currentColor,0 0 20px currentColor;
  transition:color .4s,text-shadow .4s; cursor:default; line-height:1;
}
#lyric {
  font-size:12px; font-weight:700; font-style:italic; letter-spacing:1.5px;
  opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:90vw; text-align:center;
  text-shadow:0 0 6px currentColor,0 0 14px currentColor,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
  -webkit-text-stroke:.4px currentColor;
  transition:color .4s,text-shadow .4s; line-height:1.2; margin-top:2px;
}

/* ===== 聊天 ===== */
.chat {
  flex:1; overflow-y:auto; padding:10px 90px 70px 15px;
  display:flex; flex-direction:column; gap:14px;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
.chat::-webkit-scrollbar { width:5px; }
.chat::-webkit-scrollbar-thumb { background:#c00; border-radius:3px; }

.msg { display:flex; gap:10px; max-width:85%; animation:msgIn .25s ease-out; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.av { width:42px; height:42px; border-radius:50%; border:2px solid #c00; object-fit:cover; flex-shrink:0; }

.name-nero { color:#4fc3f7 !important; }
.name-dante { color:#ff5252 !important; }
.name-vergil { color:#b0b0b0 !important; }

.bubble { background:#151515; border:1px solid #333; padding:10px 14px; border-radius:10px; line-height:1.65; font-size:16px; word-break:break-word; }
.bubble-nero { color:#4fc3f7; font-family:'Nunito','Segoe UI','Microsoft YaHei',sans-serif; font-weight:700; border-color:#1a4a6e; background:#0a1622; }
.bubble-dante { color:#ff5252; font-family:'Comic Sans MS','Segoe UI',sans-serif; font-style:italic; font-weight:600; border-color:#5a1a1a; background:#1a0a0a; }
.bubble-vergil { color:#e0e0e0; font-family:'Georgia','Times New Roman','Microsoft YaHei',serif; font-style:italic; letter-spacing:1.5px; border-color:#555; background:#0d0d0d; }
.msg.user .bubble { background:#c00; border-color:#f00; color:#fff; font-size:16px; font-weight:600; }

/* ===== 输入 ===== */
.input {
  position:fixed; bottom:0; left:0; right:80px; height:52px;
  display:flex; padding:8px 12px; gap:8px;
  border-top:1px solid #330000; background:rgba(0,0,0,0.95); z-index:999;
}
.input input { flex:1; background:#111; border:1px solid #c00; color:#fff; padding:10px 12px; border-radius:4px; outline:none; font-size:15px; }
.input button { background:#c00; color:#fff; border:none; padding:0 18px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; flex-shrink:0; }
.input button:hover { background:#f00; }

/* ★ 制作者信息 */
#creator-line {
  position:fixed; bottom:52px; left:12px; z-index:1000;
  display:flex; flex-direction:column; gap:1px; pointer-events:none; user-select:none;
}
#creator-line .c-name { color:#fff; font-size:11px; font-weight:bold; line-height:1.3; white-space:nowrap; }
#creator-line .c-qq { color:#fff; font-size:11px; font-weight:bold; line-height:1.3; white-space:nowrap; }

/* ===== 侧边栏（含武器区） ===== */
.sidebar {
  position:fixed; right:0; top:72px; bottom:0; width:80px;
  background:rgba(10,0,0,.95); border-left:2px solid #c00;
  display:flex; flex-direction:column; align-items:center;
  padding-top:15px; gap:14px; z-index:500; overflow-y:auto;
}
.sidebar::-webkit-scrollbar { display:none; }

.cbtn { width:56px; height:56px; border-radius:50%; border:3px solid #555; background-size:cover; background-position:center; cursor:pointer; opacity:.6; transition:.3s; flex-shrink:0; }
.cbtn.active { border-color:#c00; opacity:1; box-shadow:0 0 14px #c00; }
.cname { color:#fff; font-size:10px; margin-top:2px; text-align:center; margin-bottom:6px; }

#weapon-container {
  width:68px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin-top:4px; margin-bottom:8px; position:relative;
}
#weapon-img {
  max-width:100%; max-height:200px; width:auto; height:auto;
  object-fit:contain; border:3px solid #b0b0b0; border-radius:6px;
  opacity:0; transform:scale(.85) rotate(-2deg);
  transition:opacity .5s,transform .5s,filter .4s,border-color .4s,box-shadow .3s;
  pointer-events:auto; cursor:pointer;
}
#weapon-img.show { opacity:.95; transform:scale(1) rotate(0deg); }
#weapon-img.exceed-active {
  filter:brightness(.55) saturate(1.4);
  box-shadow:0 0 14px #ff3b00,0 0 28px #ff6a00;
  border-color:#ff3b00;
}
#weapon-glow {
  position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
  width:60px; height:18px; opacity:0; transition:opacity .5s,background .4s; pointer-events:none;
}
#weapon-glow.show { opacity:1; }

/* 火焰拖尾 */
#weapon-fly { position:fixed; width:80px; height:auto; pointer-events:none; z-index:600; opacity:0; display:none; }
.fire-particle { position:fixed; border-radius:50%; pointer-events:none; z-index:601; opacity:0; }

/* ===== 额度警告 ===== */
#quota-warning {
  display:none; position:fixed; bottom:52px; left:0; right:80px;
  background:rgba(20,0,0,0.95); border-top:2px solid #c00; border-bottom:2px solid #c00;
  padding:8px 14px; z-index:998; align-items:center; gap:10px; animation:warnSlideUp .4s ease-out;
}
@keyframes warnSlideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
#warn-icon { width:22px; height:22px; border-radius:50%; background:#c00; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; color:#fff; line-height:1; }
#warn-text { color:#ff9999; font-size:12px; line-height:1.4; flex:1; }
#warn-close { background:none; border:none; color:#ff6666; font-size:16px; cursor:pointer; padding:0 4px; flex-shrink:0; }
#warn-close:hover { color:#fff; }

/* ===== 其他UI ===== */
#scroll-btn { position:fixed; bottom:60px; right:88px; width:36px; height:36px; border-radius:50%; background:rgba(200,0,0,0.8); color:#fff; border:none; font-size:18px; cursor:pointer; z-index:998; display:none; align-items:center; justify-content:center; box-shadow:0 0 8px #c00; }
#scroll-btn.show { display:flex; }
#mute-btn { position:fixed; bottom:60px; right:130px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.7); color:#fff; border:1px solid #c00; font-size:16px; cursor:pointer; z-index:998; display:flex; align-items:center; justify-content:center; }
#mute-btn:hover { background:rgba(200,0,0,0.5); }
#now-playing { position:fixed; bottom:62px; right:172px; color:#c00; font-size:11px; font-weight:bold; z-index:998; pointer-events:none; opacity:0; transition:opacity 0.3s; text-shadow:0 0 4px #000; max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#now-playing.show { opacity:1; }

.dt-overlay { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #c00; box-shadow:inset 0 0 80px #c00; }
.dt-overlay.show { opacity:1; }
.dt-overlay-blue { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .3s; border:4px solid #00aaff; box-shadow:inset 0 0 80px #00aaff; }
.dt-overlay-blue.show { opacity:1; }

.style-pop { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) skewX(-10deg); font-family:'Cinzel Decorative','Times New Roman',serif; font-weight:900; z-index:500; pointer-events:none; animation:stylePop 1s ease-out forwards; text-shadow:0 0 12px currentColor,0 0 24px currentColor; }
@keyframes stylePop { 0%{opacity:0;transform:translate(-50%,-50%) skewX(-10deg) scale(.4)} 20%{opacity:1;transform:translate(-50%,-50%) skewX(-10deg) scale(1.25)} 35%{transform:translate(-50%,-50%) skewX(-10deg) scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translate(-50%,-60%) skewX(-10deg) scale(1)} }
.style-sub { display:block; font-size:16px; font-weight:700; letter-spacing:2px; margin-top:4px; font-family:'Segoe UI','Microsoft YaHei',sans-serif; font-style:normal; transform:skewX(10deg); text-align:center; }
.style-d{color:#7a6a6a} .style-c{color:#ffae42} .style-b{color:#aaff00} .style-a{color:#00e5ff} .style-s{color:#ffd700} .style-ss{color:#ff6a00} .style-sss{color:#ff2d95}
.style-sss .style-sub { animation:shake 0.4s ease-in-out 2; }
@keyframes shake { 0%,100%{transform:skewX(10deg) translateX(0)} 25%{transform:skewX(10deg) translateX(-3px)} 75%{transform:skewX(10deg) translateX(3px)} }

.blood-flash { position:fixed; inset:0; z-index:199; pointer-events:none; background:rgba(200,0,0,.15); opacity:0; }
.blood-flash.show { animation:bloodFlash .35s ease-out; }
@keyframes bloodFlash { 0%{opacity:.6} 100%{opacity:0} }
</style>
</head>

<script>
// ========== 日志 ==========
var logPanel = document.getElementById('log-panel');
var logoTapCount = 0, lastTapTime = 0;
function bindLogoTap(el) {
  el.addEventListener('click', function() {
    var now = Date.now();
    if (now - lastTapTime < 350) { logoTapCount++;
      if (logoTapCount >= 2) { logPanel.classList.toggle('show'); logoTapCount = 0; }
    } else { logoTapCount = 1; }
    lastTapTime = now;
  });
}
bindLogoTap(document.getElementById('mini-logo'));
bindLogoTap(document.getElementById('intro-logo'));
function log(msg, type) {
  var d = document.createElement('div'); d.className = 'log-line' + (type ? ' log-' + type : '');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logPanel.appendChild(d); while (logPanel.children.length > 200) logPanel.removeChild(logPanel.firstChild);
  logPanel.scrollTop = logPanel.scrollHeight;
}

// ========== 歌词 ==========
var TITLE_COLORS = { nero:"#ffffff", dante:"#ff5252", vergil:"#4fc3f7" };
var LYRICS = { nero:"Bang, bang, bang — Pull my Devil Trigger", dante:"You cannot kill me! I am Subhuman!", vergil:"I am the storm that is approaching" };
function updateTitleColor(role) {
  document.getElementById('top-title').style.color = TITLE_COLORS[role];
  var lyric = document.getElementById('lyric');
  lyric.style.color = TITLE_COLORS[role]; lyric.textContent = LYRICS[role];
  updateWeapon(role);
}

// ========== 武器 ==========
var WEAPON_IMGS = {
  vergil: "yamato.png",
  nero: "https://i.postimg.cc/BvGsMmcz/aebf56b3276a71fdea06b9e5abb942d88293704cafd5ea7544f3aa7f85e96a1d-0.png",
  dante: "https://i.postimg.cc/s2RywT90/d7bb84ad07891cb9c5fa4bdaacf4a962c2964e974fa890e552838041fa997203-0.jpg"
};
var WEAPON_BORDERS = { nero:"#4fc3f7", dante:"#ff5252", vergil:"#b0b0b0" };
var WEAPON_GLOWS = {
  nero: "radial-gradient(ellipse,rgba(79,195,247,.3) 0%,transparent 70%)",
  dante: "radial-gradient(ellipse,rgba(255,82,82,.3) 0%,transparent 70%)",
  vergil: "radial-gradient(ellipse,rgba(176,176,176,.3) 0%,transparent 70%)"
};
var weaponAnimating = false;
function updateWeapon(role) {
  var img = document.getElementById('weapon-img'), glow = document.getElementById('weapon-glow');
  img.classList.remove('show','exceed-active'); glow.classList.remove('show');
  setTimeout(function() {
    img.src = WEAPON_IMGS[role]; img.style.borderColor = WEAPON_BORDERS[role];
    glow.style.background = WEAPON_GLOWS[role];
    img.onload = function() { img.classList.add('show'); glow.classList.add('show'); };
    img.onerror = function() { log('武器加载失败:'+role,'err'); img.alt='[加载失败]'; img.classList.add('show'); };
  }, 250);
}

// ========== 火焰拖尾（绯红女皇 Exceed 特效·修复版） ==========
document.getElementById('weapon-img').addEventListener('click', function() {
  if (weaponAnimating) return;
  // 通过 src 判断是否绯红女皇，不依赖 cur 竞态
  if (this.src.indexOf('aebf56b3276a71fdea06b9e5abb942d88293704cafd5ea7544f3aa7f85e96a1d') !== -1) {
    fireEgg();
  }
});

function fireEgg() {
  weaponAnimating = true;
  var fly = document.getElementById('weapon-fly'), staticImg = document.getElementById('weapon-img');
  var rect = staticImg.getBoundingClientRect();
  var sx = rect.width > 5 ? rect.left + rect.width/2 : (innerWidth - 40);
  var sy = rect.height > 5 ? rect.top + rect.height/2 : innerHeight/2;
  var w = rect.width > 5 ? rect.width : 60;
  var h = rect.height > 5 ? rect.height : 160;

  // 原作充能：变暗+红光
  staticImg.classList.add('exceed-active');
  setTimeout(function(){ staticImg.classList.remove('exceed-active'); }, 320);

  fly.src = WEAPON_IMGS.nero;
  fly.style.display = 'block';
  fly.style.left = sx + 'px'; fly.style.top = sy + 'px';
  fly.style.width = w + 'px';
  fly.style.marginLeft = (-w/2) + 'px'; fly.style.marginTop = (-h/2) + 'px';
  fly.style.opacity = '1'; fly.style.transition = 'none'; fly.style.transform = 'rotate(0deg)';
  staticImg.style.opacity = '0.15';
  fly.offsetWidth;

  var dur = 900;
  fly.style.transition = 'left ' + dur + 'ms cubic-bezier(.4,0,.2,1), opacity 300ms ease ' + (dur-300) + 'ms, transform ' + dur + 'ms ease';
  fly.style.left = (innerWidth + 120) + 'px'; fly.style.transform = 'rotate(15deg)'; fly.style.opacity = '0';

  var layer = document.getElementById('fire-layer'); layer.innerHTML = '';
  var fireColors = [
    'radial-gradient(circle, #fff 0%, #ffeb3b 20%, #ff6a00 50%, #c62828 80%, transparent 100%)',
    'radial-gradient(circle, #fff 0%, #ff9800 30%, #d50000 60%, transparent 100%)',
    'radial-gradient(circle, #ffe082 0%, #e65100 40%, #b71c1c 70%, transparent 100%)',
    'radial-gradient(circle, #e1bee7 0%, #7b1fa2 30%, #4a148c 60%, transparent 100%)'
  ];
  var fireShadows = [
    '0 0 10px #ff6a00, 0 0 20px #ff2d00, 0 0 30px #c62828',
    '0 0 8px #ff9800, 0 0 16px #d50000',
    '0 0 6px #e65100, 0 0 12px #b71c1c',
    '0 0 8px #7b1fa2, 0 0 16px #4a148c'
  ];
  var startX = rect.width > 5 ? rect.right : sx + w/2;
  var startY = rect.height > 5 ? rect.top + rect.height/2 : sy;

  for (var i = 0; i < 36; i++) {
    (function(i) {
      var p = document.createElement('div'); p.className = 'fire-particle';
      var delay = Math.random() * 150, life = 700 + Math.random() * 500, size = 10 + Math.random() * 14;
      var colorIdx = Math.floor(Math.random() * fireColors.length);
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.left = startX + 'px'; p.style.top = (startY + (Math.random() - 0.5) * 20) + 'px';
      p.style.background = fireColors[colorIdx]; p.style.boxShadow = fireShadows[colorIdx]; p.style.borderRadius = '50%';
      layer.appendChild(p); p.offsetWidth;
      var endX = startX + (innerWidth * 0.7) + Math.random() * 120, endY = startY + (Math.random() - 0.5) * 60;
      p.style.transition = 'left ' + life + 'ms cubic-bezier(.2,.8,.2,1) ' + delay + 'ms, top ' + life + 'ms ease-out ' + delay + 'ms, opacity 350ms ease ' + (delay + life - 350) + 'ms, width 500ms ease, height 500ms ease';
      p.style.left = endX + 'px'; p.style.top = endY + 'px'; p.style.opacity = '0';
      p.style.width = (size * 0.5) + 'px'; p.style.height = (size * 0.5) + 'px';
      setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, delay + life + 100);
    })(i);
  }
  setTimeout(function() { fly.style.display='none'; fly.style.left='0px'; fly.style.opacity='0'; staticImg.style.opacity=''; weaponAnimating=false; }, dur + 100);
}

// ========== API ==========
var API_KEY = "sk-5Jg72uXUHod43eEUQOssxpIxp8mbmFCk6u3REqHAJehTO07z".trim();
var API_ENDPOINTS = ["https://speed.toter.me/v1/chat/completions", "https://api.supxh.xin/v1/chat/completions"];
var MODEL = "gemini-3-flash";

var QUOTA_LINES = {

async function callAI(role, msg) {
  var last = "";
  for (var i = 0; i < API_ENDPOINTS.length; i++) {
    try {
      var ctl = new AbortController(); var to = setTimeout(function(){ctl.abort();},25000);
      var res = await fetch(API_ENDPOINTS[i], {
        method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
        body:JSON.stringify({model:MODEL,messages:[{role:"system",content:prompts[role]},{role:"user",content:msg}],max_tokens:300,temperature:.9}),
        signal:ctl.signal
      });
      clearTimeout(to); var data = await res.json();
      if (data.error) {
        var errMsg = data.error.message || JSON.stringify(data.error); last = errMsg;
        log('API错误('+API_ENDPOINTS[i]+'): '+errMsg,'err');
        if (/token|key|auth|quota|limit|429|RESOURCE_EXHAUSTED|额度|余额|invalid/i.test(errMsg)) return QUOTA_LINES[role];
        if (/timeout|超时|abort/i.test(errMsg)) return role==='vergil'?"……通讯延迟。弱者总是需要等待。":QUOTA_LINES[role];
        continue;
      }
      return data.choices ? data.choices[0].message.content : "（魔界通讯中断…）";
    } catch(e) { last = e.name==='AbortError'?"请求超时":e.message; log('请求失败('+API_ENDPOINTS[i]+'): '+last,'err'); continue; }
  }
  return QUOTA_LINES[role];
}

function checkQuota() {
  log('正在预检 API 额度...','warn');
  fetch(API_ENDPOINTS[0], {
    method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:"user",content:"hi"}],max_tokens:1})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data.error && /token|key|auth|quota|limit|429|RESOURCE_EXHAUSTED|invalid/i.test(JSON.stringify(data.error))) {
      log('预检结果：额度已耗尽','warn');
      document.getElementById('quota-warning').style.display = 'flex';
      document.getElementById('ui').placeholder = "⚠️ AI 额度已耗尽，明天再来～";
    } else { log('预检结果：额度正常','ok'); }
  })
  .catch(function(){ log('预检请求失败（不影响正常使用）','warn'); });
}

function setVolumes(){ Object.keys(audios).forEach(function(k){ audios[k].volume=isMuted?0:0.3; }); }
function forceUnlockAndPlay(role){ var t=audios[role]; t.volume=0; t.currentTime=0; var p=t.play(); if(p&&p.then) p.then(function(){ setTimeout(function(){t.volume=isMuted?0:0.3;if(!isMuted){np.textContent=TRACK_NAMES[role];np.classList.add('show');}},100); }); }
function playRole(role){ Object.keys(audios).forEach(function(k){if(k!==role){audios[k].pause();try{audios[k].currentTime=0;}catch(e){}}}); np.textContent=TRACK_NAMES[role]; np.classList.add('show'); var t=audios[role]; t.volume=isMuted?0:0.3; try{t.currentTime=0;}catch(e){} var p=t.play(); if(p&&p.then)p.catch(function(){}); }
function unlockAudio(){ if(audioUnlocked)return; audioUnlocked=true; setVolumes(); forceUnlockAndPlay(cur); }
document.body.addEventListener('click',unlockAudio,{once:true}); document.body.addEventListener('touchstart',unlockAudio,{once:true});

function tick(){ p+=.018; if(p>=1)p=1; var e=ease(p); logo.style.left=(sx+(ex-sx)*e-120)+"px"; logo.style.top=(sy+(ey-sy)*e-25)+"px"; logo.style.opacity=e; logo.style.filter="blur("+((1-e)*12)+"px)"; logo.style.transform="scale("+(1-e*.83)+")"; if(p<1)requestAnimationFrame(tick); else{ intro.style.opacity=0; setTimeout(function(){intro.style.display='none';app.style.display='flex';mini.style.display='block';updateTitleColor(cur);say(cur,intros[cur],false);checkQuota();},600);}}

function stylePop(inputLen,replyText){var score=Math.min(60,inputLen*2);var kw=['力量','恶魔','阎魔刀','斯巴达','魔界','Devil Trigger','Jackpot','Yahoo','Style','姬莉叶','妮可','尼禄','但丁','维吉尔'];var kc=0;kw.forEach(function(k){if(replyText.indexOf(k)!==-1)kc++;});score+=Math.min(40,kc*8+Math.min(20,replyText.length/10));score=Math.min(100,Math.max(0,score));var idx=score<15?0:score<30?1:score<45?2:score<60?3:score<75?4:score<90?5:6;var s=STYLE_TABLE[idx];var pop=document.createElement('div');pop.className='style-pop '+s.cls;pop.style.fontSize=(s.g.length>1?64:88)+"px";pop.innerHTML=s.g+'<span class="style-sub">'+s.sub+'</span>';document.body.appendChild(pop);setTimeout(function(){pop.remove();},1000);}

// ========== 魔人化 ==========
var pressTimer=null,pressStart=0;
function bindDT(id,role){var b=document.getElementById(id);b.addEventListener('touchstart',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(role);},1500);});b.addEventListener('touchend',function(e){e.preventDefault();clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(role);});b.addEventListener('mousedown',function(e){e.preventDefault();pressStart=Date.now();pressTimer=setTimeout(function(){triggerDT(role);},1500);});b.addEventListener('mouseup',function(){clearTimeout(pressTimer);if(Date.now()-pressStart<500)sw(cur);});b.addEventListener('mouseleave',function(){clearTimeout(pressTimer);});}
function triggerDT(role){var o=role==='dante'?document.getElementById('dt-red'):document.getElementById('dt-blue');o.classList.add('show');setTimeout(function(){o.classList.remove('show');},800);say(role,dtLines[role],false);}
